<title>2026 신상 랭킹 진입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에 달·카테고리 고르는 막대(고정), 아래는 대분류 → 세부 종류 → 상품 카드 격자. 룩북 색인처럼 사진이 주인공 */
:root{
  --paper:#eef0ec; --surface:#ffffff; --surface-2:#e4e7e1; --ink:#15171a; --ink-2:#33373c; --muted:#5a5f64;
  --line:#d3d7cf; --ok:#1d7a46; --accent:#1d48c4; --accent-soft:#e1e8fb; --new:#b8430f; --new-soft:#fbe9df;
  --shadow:0 1px 2px rgba(20,24,30,.08);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111315; --surface:#1a1d20; --surface-2:#24282c; --ink:#eceee9; --ink-2:#cfd3d6; --muted:#a3a8ad;
  --line:#2f3438; --ok:#5fd08f; --accent:#93b1ff; --accent-soft:#1f2b4a; --new:#ff9a62; --new-soft:#3a2418; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#111315; --surface:#1a1d20; --surface-2:#24282c; --ink:#eceee9; --ink-2:#cfd3d6; --muted:#a3a8ad;
  --line:#2f3438; --ok:#5fd08f; --accent:#93b1ff; --accent-soft:#1f2b4a; --new:#ff9a62; --new-soft:#3a2418; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;word-break:keep-all;margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 머리 */
.head{display:grid;gap:10px;max-width:760px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:500}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);font-size:16px;max-width:65ch}

/* 달 × 대분류 표 */
.overview{margin-top:26px;display:grid;gap:10px}
.overview h2{font-size:18px;margin:0}
.overview .sub{margin:0;color:var(--muted);font-size:13.5px}
.tbl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
table.mx{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
.mx th,.mx td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx thead th{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.03em}
.mx tbody tr{cursor:pointer}
.mx tbody tr:hover td{background:var(--surface-2)}
.mx tbody tr.on td{background:var(--accent-soft)}
.mx tbody tr:last-child td{border-bottom:0}
.mx td.cell{position:relative}
.mx .bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);opacity:.55;vertical-align:middle;margin-right:8px}
.mx td.tot{font-weight:700}

/* 고르는 막대 */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);margin-top:28px;padding-block:12px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lab{font-size:12.5px;color:var(--muted);width:44px;flex:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-size:14px;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .c{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:4px}
select{font:inherit;font-size:14px;min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.status{font-size:14px;color:var(--ink-2)}
.status b{color:var(--ink)}

/* 목록 */
.cat{margin-top:34px}
.cat > h2{font-size:24px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
.cat > h2 .n{font-family:var(--mono);font-size:15px;color:var(--muted);font-weight:400}
.type{margin-top:18px}
.type h3{font-size:16px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.type h3 .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:14px}
.card{background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:5/6;background:var(--surface-2);display:block;position:relative;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:8px;text-align:center}
.tag{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--new-soft);color:var(--new);letter-spacing:.02em}
.tag.cont{background:var(--surface);color:var(--ink-2);font-weight:500}
.body{padding:10px 11px 12px;display:grid;gap:5px;min-width:0}
.brand{font-size:13px;font-weight:700;color:var(--ink)}
.name{font-size:13.5px;color:var(--ink-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none}
.name:hover{text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.meta .price{color:var(--ink);font-weight:500}
.ranks{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.rk{font-size:12px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.rk b{font-family:var(--mono);font-weight:500}
.rk.top{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.hist{font-size:12px;color:var(--muted)}
.off{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:0 6px;justify-self:start}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.why-btn{appearance:none;font:inherit;font-size:12.5px;font-weight:500;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;flex:none}
.why-btn:hover{background:var(--accent-soft)}
.why-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dialog.why{border:1px solid var(--line);border-radius:14px;padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.25)}
dialog.why::backdrop{background:rgba(10,12,15,.45)}
.why-in{padding:18px 20px 20px;display:grid;gap:12px;overflow:auto;max-height:calc(100vh - 50px)}
.why-head{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start}
.why-head img,.why-head .ph0{width:64px;aspect-ratio:5/6;object-fit:cover;border-radius:6px;background:var(--surface-2);display:block}
.why-head .wb{font-size:13px;color:var(--muted)}
.why-head .wn{font-size:16px;font-weight:700;line-height:1.35}
.why-head .wm{font-size:13px;color:var(--muted);margin-top:2px}
.why-x{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;width:36px;height:36px;font-size:18px;line-height:1;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cz{font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.cf{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid var(--ok);color:var(--ok)}
.cf.guess{border-color:var(--muted);color:var(--muted);font-weight:500}
.why ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;color:var(--ink-2)}
.why details summary{cursor:pointer;font-size:14px;color:var(--ink-2)}
.why details p{font-size:14px;color:var(--ink-2);margin:8px 0 0;white-space:pre-line}
.why .src{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:4px 12px}
.why .src a{color:var(--accent)}
.why .from{font-size:12.5px;color:var(--muted)}
.ctx{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
.ctx b{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.ctx .cl{display:flex;gap:8px}
.ctx .cl span:first-child{flex:none;color:var(--muted);width:3.2em}
.ctx .cs{font-size:12.5px;display:flex;flex-wrap:wrap;gap:2px 10px}
.ctx .cs a{color:var(--muted)}
.empty{margin-top:30px;padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}

/* 보는 법 */
details.how{margin-top:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
details.how summary{cursor:pointer;font-weight:500}
details.how ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px;display:grid;gap:4px;max-width:75ch}

@media (max-width:560px){
  .wrap{padding-inline:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .row .lab{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="head">
    <div class="eyebrow" id="eyebrow"></div>
    <h1>2026 신상 랭킹 진입</h1>
    <p class="lede" id="lede"></p>
  </header>

  <section class="overview" aria-labelledby="ov-h">
    <h2 id="ov-h">달마다 처음 랭킹에 오른 신상 수</h2>
    <p class="sub">줄을 누르면 그 달 목록으로 갑니다.</p>
    <div class="tbl-scroll"><table class="mx" id="mx"></table></div>
  </section>

  <div class="controls" id="controls">
    <div class="row" role="group" aria-label="달"><span class="lab">달</span><span id="months" class="row"></span></div>
    <div class="row" role="group" aria-label="카테고리"><span class="lab">분류</span><span id="cats" class="row"></span></div>
    <div class="row"><span class="lab">보기</span>
      <span class="row" id="modes"></span>
      <label for="sort" class="lab" style="width:auto;margin-left:6px">정렬</label>
      <select id="sort">
        <option value="rank">그 달 순위순</option>
        <option value="reg">등록 최신순</option>
        <option value="price">정가 높은순</option>
      </select>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <main id="list"></main>
  <dialog class="why" id="why" aria-labelledby="why-name"><div class="why-in" id="why-in"></div></dialog>

  <details class="how">
    <summary>보는 법 · 기준</summary>
    <ul id="how"></ul>
  </details>
</div>

<script>
const D = /*__DATA__*/null;
const IMG = /*__IMGS__*/null;
const M = D.months, CATS = D.cats;
const CAT_ORDER = ["001","002","003","100"].filter(c=>CATS[c]);
const items = Object.entries(D.items).map(([id,p])=>({id,...p}));
const mLabel = ym => `${+ym.slice(5)}월`;
const won = n => n.toLocaleString("ko-KR")+"원";
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = id => `https://www.musinsa.com/products/${id}`;
const catsUsed = CAT_ORDER.filter(c=>items.some(p=>p.c===c));

const state = {m: M[M.length-1], cat: "all", mode: "first", sort: "rank"};
try{ const h = location.hash.slice(1); if(/^m\d{4}-\d{2}$/.test(h) && M.includes(h.slice(1))) state.m = h.slice(1); }catch(e){}

// 그 달 순위 점수: 대분류 순위가 있으면 그것, 없으면 30 + 세부 순위 중 가장 높은 것
function score(p, ym){ const r = p.r[ym]; if(!r) return 999; if(r.top) return r.top; return 30 + Math.min(...Object.values(r.sub||{99:99})); }
function inView(p){ return state.mode==="first" ? p.f===state.m : !!p.r[state.m]; }
function monthsUpTo(p, ym){ return Object.keys(p.r).filter(m=>m<=ym).length; }

document.getElementById("eyebrow").textContent = `무신사 남성 월간 랭킹 · ${D.year}년 ${mLabel(M[0])}~${mLabel(M[M.length-1])}`;
document.getElementById("lede").textContent = `${D.year}년에 새로 등록된 상품 중 월간 랭킹(대분류·세부 카테고리 TOP 30)에 오른 ${items.length.toLocaleString()}개를 달·카테고리별로 모았습니다. 후기가 쌓인 스테디셀러는 빠지고 올해 나온 옷만 남습니다.`;

function renderMatrix(){
  const counts = M.map(ym=>{ const row = {}; catsUsed.forEach(c=>row[c]=items.filter(p=>p.f===ym && p.c===c).length); row.t = catsUsed.reduce((a,c)=>a+row[c],0); return row; });
  const max = Math.max(1, ...counts.flatMap(r=>catsUsed.map(c=>r[c])));
  const tot = {}; catsUsed.forEach(c=>tot[c]=counts.reduce((a,r)=>a+r[c],0));
  document.getElementById("mx").innerHTML =
    `<thead><tr><th scope="col">처음 오른 달</th>${catsUsed.map(c=>`<th scope="col">${CATS[c]}</th>`).join("")}<th scope="col">합계</th></tr></thead>
     <tbody>${M.map((ym,i)=>`<tr data-m="${ym}" class="${ym===state.m?"on":""}" tabindex="0"><td>${mLabel(ym)}</td>${catsUsed.map(c=>`<td class="cell num"><span class="bar" style="width:${Math.round(counts[i][c]/max*48)}px"></span>${counts[i][c]}</td>`).join("")}<td class="num tot">${counts[i].t}</td></tr>`).join("")}
       <tr><td><b>전체</b></td>${catsUsed.map(c=>`<td class="num"><b>${tot[c]}</b></td>`).join("")}<td class="num tot">${items.length}</td></tr></tbody>`;
}

function chip(label, pressed, data, count){ return `<button type="button" class="chip" aria-pressed="${pressed}" ${data}>${label}${count!=null?`<span class="c">${count}</span>`:""}</button>`; }

function renderControls(){
  const inMonth = ym => state.mode==="first" ? items.filter(p=>p.f===ym).length : items.filter(p=>p.r[ym]).length;
  document.getElementById("months").innerHTML = M.map(ym=>chip(mLabel(ym), ym===state.m, `data-m="${ym}"`, inMonth(ym))).join("");
  const base = items.filter(inView);
  document.getElementById("cats").innerHTML = chip("전체", state.cat==="all", `data-c="all"`, base.length) + catsUsed.map(c=>chip(CATS[c], state.cat===c, `data-c="${c}"`, base.filter(p=>p.c===c).length)).join("");
  document.getElementById("modes").innerHTML = chip("이 달 처음 오른 신상", state.mode==="first", `data-mode="first"`) + chip("이 달 순위에 있던 신상 전부", state.mode==="all", `data-mode="all"`);
  document.getElementById("sort").value = state.sort;
  document.querySelectorAll("#mx tbody tr[data-m]").forEach(tr=>tr.classList.toggle("on", tr.dataset.m===state.m));
}

function card(p){
  const ym = state.m, r = p.r[ym] || {};
  const n = monthsUpTo(p, ym), total = Object.keys(p.r).length;
  const first = p.f===ym;
  const ranks = [];
  if(r.top) ranks.push(`<span class="rk top">${CATS[p.c]} <b>${r.top}</b>위</span>`);
  Object.entries(r.sub||{}).sort((a,b)=>a[1]-b[1]).slice(0,2).forEach(([s,v])=>ranks.push(`<span class="rk">${esc(s)} <b>${v}</b>위</span>`));
  const img = IMG[p.id];
  const span = total>1 ? `랭킹 ${total}개월 · ${mLabel(Object.keys(p.r)[0])}~${mLabel(Object.keys(p.r).slice(-1)[0])}` : `랭킹 1개월`;
  return `<article class="card">
    <a class="ph" href="${url(p.id)}" target="_blank" rel="noreferrer" aria-label="${esc(p.b+" "+p.n)} 무신사에서 보기">${img?`<img src="${img}" alt="" loading="lazy">`:`<span class="noimg">${esc(p.b)}</span>`}<span class="tag ${first?"":"cont"}">${first?"처음 진입":`${n}개월째`}</span></a>
    <div class="body">
      <div class="brand">${esc(p.b)}</div>
      <a class="name" href="${url(p.id)}" target="_blank" rel="noreferrer" title="${esc(p.n)}">${esc(p.n)}</a>
      <div class="meta"><span>등록 <span class="num">${+p.d.slice(5,7)}.${+p.d.slice(8)}</span></span>${p.p?`<span class="price num">${won(p.p)}</span>`:`<span>정가 정보 없음</span>`}</div>
      <div class="ranks">${ranks.join("")}</div>
      ${p.x?`<span class="off">판매 종료</span>`:""}
      <div class="foot"><span class="hist">${span}</span>${p.q?`<button type="button" class="why-btn" data-why="${p.id}">이유</button>`:""}</div>
    </div>
  </article>`;
}

function sorter(){
  const ym = state.m;
  if(state.sort==="reg") return (a,b)=>b.d.localeCompare(a.d) || score(a,ym)-score(b,ym);
  if(state.sort==="price") return (a,b)=>(b.p||0)-(a.p||0) || score(a,ym)-score(b,ym);
  return (a,b)=>score(a,ym)-score(b,ym);
}

function renderList(){
  const list = items.filter(p=>inView(p) && (state.cat==="all" || p.c===state.cat));
  const per = catsUsed.map(c=>[c, list.filter(p=>p.c===c).length]).filter(([,n])=>n);
  document.getElementById("status").innerHTML = `<b>${mLabel(state.m)}</b> ${state.mode==="first"?"처음 랭킹에 오른":"랭킹에 있던"} 신상 <b class="num">${list.length}</b>개${per.length?` · ${per.map(([c,n])=>`${CATS[c]} ${n}`).join(" · ")}`:""}`;
  if(!list.length){ document.getElementById("list").innerHTML = `<p class="empty">이 조건에 맞는 신상이 없습니다. 다른 달이나 '이 달 순위에 있던 신상 전부'를 눌러 보세요.</p>`; return; }
  const sort = sorter();
  document.getElementById("list").innerHTML = catsUsed.filter(c=>state.cat==="all"||c===state.cat).map(c=>{
    const inCat = list.filter(p=>p.c===c); if(!inCat.length) return "";
    const groups = {}; inCat.forEach(p=>(groups[p.s]=groups[p.s]||[]).push(p));
    const order = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length || Math.min(...a[1].map(p=>score(p,state.m)))-Math.min(...b[1].map(p=>score(p,state.m))));
    return `<section class="cat"><h2>${CATS[c]} <span class="n">${inCat.length}개</span></h2>
      ${order.map(([s,ps])=>`<div class="type"><h3>${esc(s==="기타"?"세부 분류 없음":s)} <span class="n">${ps.length}</span></h3><div class="grid">${ps.sort(sort).map(card).join("")}</div></div>`).join("")}
    </section>`;
  }).join("");
}

function render(){ renderControls(); renderList(); }

const dlg = document.getElementById("why");
// 그 달 배경: 날씨 · 무신사 행사 · 같은 브랜드 신상 동반 진입 (2026-10-15 사장님: 유튜브만 말고 종합적으로)
function ctxBlock(p, id){
  const c = (D.context||{})[p.f] || {}, same = items.filter(x=>x.b===p.b && x.f===p.f && x.id!==id).length;
  const lines = [];
  if(c.weather) lines.push(["날씨", c.weather]);
  (c.events||[]).forEach(e=>lines.push(["무신사", e]));
  if(same) lines.push(["브랜드", `같은 달 ${esc(p.b)} 신상 ${same}개도 함께 처음 랭킹에 오름`]);
  if(!lines.length) return "";
  return `<div class="ctx"><b>${mLabel(p.f)} 배경 (처음 랭킹에 오른 달)</b>${lines.map(([k,v])=>`<div class="cl"><span>${k}</span><span>${k==="브랜드"?v:esc(v)}</span></div>`).join("")}${(c.sources||[]).length?`<div class="cs">${c.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)}</a>`).join("")}</div>`:""}</div>`;
}
function openWhy(id){
  const p = D.items[id], q = p.q, img = IMG[id];
  document.getElementById("why-in").innerHTML = `
    <div class="why-head">${img?`<img src="${img}" alt="">`:`<span class="ph0"></span>`}
      <div><div class="wb">${esc(p.b)}</div><div class="wn" id="why-name"><a href="${url(id)}" target="_blank" rel="noreferrer">${esc(p.n)}</a></div>
        <div class="wm">${esc(p.s)} · 등록 ${p.d} · 처음 랭킹 ${mLabel(p.f)}${p.p?` · 정가 ${won(p.p)}`:""}</div></div>
      <button type="button" class="why-x" data-close aria-label="닫기" autofocus>×</button></div>
    <div class="chips">${q.c.map(c=>`<span class="cz">${esc(c)}</span>`).join("")}<span class="cf ${q.cf==="확인"?"":"guess"}">${esc(q.cf)}</span></div>
    <ul>${q.pt.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <details><summary>조사 내용 전체 보기</summary><p>${esc(q.r)}</p></details>
    ${ctxBlock(p, id)}
    ${q.src.length?`<div class="src">출처 ${q.src.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(t)}</a>`).join("")}</div>`:""}`;
  dlg.showModal();
}
document.getElementById("list").addEventListener("click", e=>{ const b = e.target.closest("[data-why]"); if(b) openWhy(b.dataset.why); });
dlg.addEventListener("click", e=>{ if(e.target===dlg || e.target.closest("[data-close]")) dlg.close(); });

document.getElementById("controls").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.m){ state.m = b.dataset.m; try{ history.replaceState(null,"","#m"+state.m); }catch(err){} }
  if(b.dataset.c) state.cat = b.dataset.c;
  if(b.dataset.mode) state.mode = b.dataset.mode;
  render();
});
document.getElementById("sort").addEventListener("change", e=>{ state.sort = e.target.value; renderList(); });
function pickRow(tr){ state.m = tr.dataset.m; state.mode = "first"; render(); document.getElementById("controls").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
document.getElementById("mx").addEventListener("click", e=>{ const tr = e.target.closest("tr[data-m]"); if(tr) pickRow(tr); });
document.getElementById("mx").addEventListener("keydown", e=>{ const tr = e.target.closest("tr[data-m]"); if(tr && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); pickRow(tr); } });

document.getElementById("how").innerHTML = [
  `신상 = ${D.year}년 1월 1일 이후 무신사에 등록된 상품. 등록일은 무신사 상품 사진 주소에 찍힌 날짜입니다(상품 번호 순서와 맞는지 확인함).`,
  `순위 = 그 달 무신사 남성 월간 랭킹. 대분류(상의·아우터·바지) TOP 30과 그 아래 세부 카테고리 TOP 30을 모두 봅니다. 파란 칸이 대분류 순위입니다.`,
  `'처음 진입'은 그 달에 처음 랭킹에 오른 상품, 'N개월째'는 그 전 달부터 랭킹에 있던 상품입니다(빠졌다 다시 오른 달도 셈).`,
  `스포츠·아웃도어 브랜드와 운동복(트레이닝·트랙·러닝 등) ${D.excluded.toLocaleString()}개는 뺐습니다. 상품 기획 분석과 같은 기준입니다.`,
  `정가는 2026년 10월에 조회한 정가입니다(그 달 당시 가격이 아님). 할인가는 넣지 않았습니다.`,
  `'이유' 버튼 = 랭킹에 오른 이유를 유튜브·웹·커뮤니티에서 조사한 내용(매일 리포트 '시장 동향'과 같은 방법). 처음 오른 달에 ${D.reason_rank}위 안에 든 신상 ${D.reason_targets}개가 대상이고 지금 ${D.reason_done}개 조사했습니다. '확인'은 이 상품을 직접 소개한 콘텐츠를 찾은 것, '추정'은 못 찾아 정황으로 판단한 것입니다.`,
  `세부 종류는 그 상품이 가장 많이 오른 세부 카테고리입니다. 사진이나 이름을 누르면 무신사 상품 페이지가 새 창으로 열립니다.`
].map(t=>`<li>${esc(t)}</li>`).join("");

renderMatrix(); render();
</script>
