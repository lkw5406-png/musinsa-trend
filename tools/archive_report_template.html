<title>무신사 의류 랭킹 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --page:#f3f4f2; --surface:#fcfcfb; --surface-2:#eceeeb;
  --ink:#111315; --ink-2:#44474b; --muted:#63676b; --hair:#dfe1dd; --axis:#c3c5c0;
  --accent:#1c5cab; --accent-soft:#e3edf9;
  --new:#1c5cab; --re:#6b4fa8; --up:#1d7a4a; --sd-low:#7fb0ea;
  --h0:#e9ebe7; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#256abf; --h6:#104281;
  --tip-bg:#111315; --tip-ink:#fcfcfb; --heat-hi-ink:#fff;
  --sans:"IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0f1011; --surface:#18191a; --surface-2:#222325;
    --ink:#f1f1ef; --ink-2:#cdcec9; --muted:#a2a4a3; --hair:#2c2d2e; --axis:#3a3b3c;
    --accent:#86b6ef; --accent-soft:#16243a;
    --new:#86b6ef; --re:#b3a4ec; --up:#5cc98d; --sd-low:#2f5f9e;
    --h0:#232425; --h1:#1d3f6e; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#b7d3f6;
    --tip-bg:#f1f1ef; --tip-ink:#111315; --heat-hi-ink:#0f1011;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f1011; --surface:#18191a; --surface-2:#222325;
  --ink:#f1f1ef; --ink-2:#cdcec9; --muted:#a2a4a3; --hair:#2c2d2e; --axis:#3a3b3c;
  --accent:#86b6ef; --accent-soft:#16243a;
  --new:#86b6ef; --re:#b3a4ec; --up:#5cc98d; --sd-low:#2f5f9e;
  --h0:#232425; --h1:#1d3f6e; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#b7d3f6;
  --tip-bg:#f1f1ef; --tip-ink:#111315; --heat-hi-ink:#0f1011;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;margin:0;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:1px solid var(--hair)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandline{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brandline span{color:var(--muted);font-weight:400;margin-left:8px;font-size:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:15px;min-height:44px;padding:0 18px;border-radius:6px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--hair)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;display:flex;align-items:center;min-height:44px;text-decoration:none;color:var(--ink-2);font-size:16px;padding:0 14px;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{padding-block:40px 28px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(26px,4.2vw,40px);line-height:1.2;letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);font-size:17px;max-width:76ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.facts b{font-family:var(--mono);color:var(--ink);font-weight:500}

section.view{display:flex;flex-direction:column;gap:48px;padding-top:8px}
h2{font-size:24px;line-height:1.35;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-size:17px;line-height:1.4;margin:0;text-wrap:balance}
.lede{color:var(--ink-2);margin:6px 0 0;max-width:76ch}
.lede + .note{margin-top:14px}
/* 접어 둔 계산 방법 (how-) */
.how-box{margin:6px 0 0;font-size:15px;color:var(--ink-2);max-width:76ch}
.how-box summary{display:inline-flex;align-items:center;min-height:36px;cursor:pointer;color:var(--accent);font-size:14.5px;font-weight:500}
.how-box summary:hover{text-decoration:underline}
.how-box p{margin:4px 0 8px}
.linkbtn{font:inherit;font-size:14.5px;border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0;white-space:nowrap}
.linkbtn:hover{text-decoration:underline}
.block{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* findings */
.findings{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px}
.finding{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.finding h3{font-size:18px}
.sm-no{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.finding p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.7}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .ph{width:52px;height:62px}

/* season board */
.seasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.season{background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.season h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.season ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.season li{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15px;line-height:1.4;align-items:baseline}
.season li .v{font-family:var(--mono);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.season li .c{color:var(--muted);font-size:13px;display:block}
@media (max-width:820px){.seasons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.seasons{grid-template-columns:1fr}}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;font-size:15px;border:1px solid var(--axis);background:var(--surface);color:var(--ink-2);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer}
.chips button:hover{border-color:var(--ink);color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink);font-weight:700}

/* product photo */
.ph{position:relative;flex:none;width:64px;height:76px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:700}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* steady list (sd-) : 꾸준템 탭 전용. 다른 탭과 이름이 겹치지 않게 전부 sd- */
.sd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sd-item{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:34px 72px minmax(0,1fr);gap:16px}
.sd-no{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.sd-item>.ph{width:72px;height:86px}
.sd-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.sd-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.sd-brand{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.sd-now{font-size:13px;font-weight:700;color:var(--up);border:1px solid currentColor;border-radius:4px;padding:0 6px;white-space:nowrap}
.sd-now.sd-gone{color:var(--muted);font-weight:500}
.sd-name{font-size:17px;font-weight:700;line-height:1.4;text-decoration:none;overflow-wrap:anywhere}
.sd-name:hover{text-decoration:underline}
.sd-stats{margin:0;display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:10px 32px}
.sd-stats div{display:flex;flex-direction:column-reverse;gap:1px}
.sd-stats dt{font-size:13px;color:var(--ink-2)}
.sd-stats dd{margin:0;font-family:var(--mono);font-size:20px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.sd-stats dd small{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--ink-2);margin-left:1px}
.sd-stats .sd-lead dd{color:var(--accent)}
.sd-chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;max-width:760px}
.sd-axis{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:13px;line-height:1;color:var(--muted);text-align:right}
.sd-bars,.sd-years{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.sd-bars{height:52px;border-bottom:1px solid var(--axis)}
.sd-bars span{display:flex;align-items:flex-end;padding-inline:1px;min-width:0}
.sd-bars span.sd-jan,.sd-years span.sd-jan{border-left:1px solid var(--axis)}
.sd-bars i{display:block;width:100%;height:var(--sd-h);border-radius:2px 2px 0 0;background:var(--sd-low)}
.sd-bars i.sd-hi{background:var(--accent)}
.sd-bars i.sd-out{height:3px;border-radius:0;background:var(--axis)}
.sd-bars span:hover i{outline:2px solid var(--ink);outline-offset:0}
.sd-years{grid-column:2;font-family:var(--mono);font-size:13px;line-height:1.3;color:var(--muted)}
.sd-years span{white-space:nowrap;padding-left:3px;min-width:0;height:16px}
.sd-why{margin:0;background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.6;max-width:760px}
.sd-why b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.sd-legend i.sd-lg-out{height:3px;border-radius:0;background:var(--axis)}
.pbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.pname{font-size:15.5px;font-weight:500;line-height:1.4}
.pname a{text-decoration:none}
.pname a:hover{text-decoration:underline}
.pbrand{color:var(--muted);font-size:13.5px}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink-2)}
.pmeta b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.reason{font-size:15px;line-height:1.65;color:var(--ink-2);margin:0;max-width:78ch}
.reason::before{content:"이유";font-size:13px;font-weight:700;color:var(--accent);margin-right:8px}
.legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:12px;border-radius:2px;display:inline-block}

/* heatmap */
.heat-card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.heat-scroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;font-size:13px}
table.heat th{font-weight:400;color:var(--muted);white-space:nowrap}
table.heat th.row{text-align:right;padding-right:8px;color:var(--ink-2);font-size:13.5px;position:sticky;left:0;background:var(--surface);z-index:1}
table.heat thead th{font-family:var(--mono);font-size:12px;text-align:center;height:18px}
table.heat thead th.y{text-align:left;color:var(--ink-2)}
table.heat td{width:20px;min-width:20px;height:20px;border-radius:3px;background:var(--h0);text-align:center;font-family:var(--mono);font-size:12px;color:transparent;cursor:default}
table.heat td.gap{background:transparent;width:6px;min-width:6px}
table.heat td[data-l="4"]{color:#fff} table.heat td[data-l="5"],table.heat td[data-l="6"]{color:var(--heat-hi-ink)}
table.heat td:hover{outline:2px solid var(--ink);outline-offset:0}
.note{background:var(--accent-soft);border-radius:8px;padding:14px 16px;font-size:15.5px;line-height:1.7;color:var(--ink);max-width:80ch}

/* category type analysis (cz-) */
.cz-card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:4px}
.cz-card h3{font-size:16px;margin-bottom:6px}
.cz-row{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--hair)}
.cz-row:nth-of-type(1){border-top:0}
.cz-main{display:grid;grid-template-columns:minmax(0,10em) minmax(60px,1fr) 2.6em auto;align-items:center;gap:10px;font-size:15px}
.cz-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-bar{position:relative;height:16px;background:var(--surface-2);border-radius:3px}
.cz-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.cz-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.cz-val{font-family:var(--mono);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.cz-facts{margin:0;display:flex;flex-wrap:wrap;gap:2px 20px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.cz-facts div{display:flex;gap:6px;min-width:0}
.cz-facts dt{flex:none;color:var(--muted)}
.cz-facts dd{margin:0}
.cz-h{font-size:19px;margin-top:14px}
.cz-prods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cz-prods li{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cz-prods .ph{width:100%;height:auto;aspect-ratio:5/6}
.cz-pinfo{display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.45;min-width:0}
.cz-pinfo .pname{text-decoration:none;font-weight:500;line-height:1.35}
.cz-rk{font-family:var(--mono);color:var(--accent);font-weight:500}
.cz-pmeta{font-size:13px;color:var(--ink-2)}
.cz-kw{font-size:13px;color:var(--muted)}
@media (max-width:560px){.cz-main{grid-template-columns:minmax(0,7em) minmax(40px,1fr) 2.4em;} .cz-main .tr{grid-column:1/-1;margin-left:0}}

/* month view */
.month-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.month-nav button,select{font:inherit;font-size:16px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:8px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer}
.month-nav button:hover:not(:disabled),select:hover{border-color:var(--ink)}
.month-nav button:disabled{opacity:.35;cursor:default}
.context{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.context p{margin:0;max-width:76ch;font-size:17px;line-height:1.7}
.context ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:15.5px;line-height:1.7;max-width:76ch;display:flex;flex-direction:column;gap:8px}
.sources{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:10px;border-top:1px solid var(--hair)}
.sources a{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:16px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid currentColor;margin-right:6px}
.badge.new{color:var(--new)} .badge.re{color:var(--re)} .badge.up{color:var(--up)}
.tops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.tops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tops{grid-template-columns:1fr}}
.topcol{display:flex;flex-direction:column;gap:10px}
.topcol h3{font-size:17px;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.topcol h3 .linkbtn{font-weight:400}
.mini{display:grid;grid-template-columns:20px 48px minmax(0,1fr);gap:10px;align-items:center;font-size:14.5px;line-height:1.4;text-decoration:none}
.mini:hover .nm{text-decoration:underline}
.mini .ph{width:48px;height:57px}
.mini .r{font-family:var(--mono);color:var(--muted);text-align:right}
.mini .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.mini .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .mb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* season recommendations */
.chips button small{color:inherit;opacity:.7;font-size:13px}
.recs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.rec{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.rhead{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.rk{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--accent);line-height:1.1}
.rhead h3{font-size:18px}
.rmeta{font-size:14px;line-height:1.55;color:var(--ink-2);margin-top:4px}
.rmeta b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.tr{display:inline-block;font-size:13px;font-weight:700;margin-left:4px;color:var(--muted)}
.tr.up{color:var(--up)} .tr.down{color:var(--re)}
.tags{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px;line-height:1.5}
.tags div{display:contents}
.tags dt{color:var(--muted)} .tags dd{margin:0}
.rprods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rprods a{text-decoration:none;display:flex;flex-direction:column;gap:4px;min-width:0}
.rprods .ph{width:100%;height:auto;aspect-ratio:5/6}
.rb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* bars (keyword & brand) */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.bgroup{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.bgroup h3{font-size:18px;margin-bottom:4px}
.barrow{display:grid;grid-template-columns:1.5em minmax(0,7.5em) minmax(60px,1fr) 4.4em 3.2em;align-items:center;gap:10px;font-size:15px}
.barrow .bd-no{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.barrow .bv small{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-left:1px}
.barrow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bt{position:relative;height:16px;background:var(--surface-2);border-radius:3px}
.barrow .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.barrow .bt b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.barrow .bv{font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.dl{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

    <div class="top-row">
      <div class="brandline">무신사 의류 랭킹 분석<span id="range"></span></div>
      <div class="seg" role="group" aria-label="성별" id="gender"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="보기"></nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 id="hero-title">무신사 월간 TOP 30에 오른 옷들</h1>
    <p id="hero-sub"></p>
    <div class="facts" id="facts"></div>
  </div>
  <div id="app"></div>
  <footer>
    <div>자료: 무신사 월간 랭킹 아카이브(www.musinsa.com/ranking/archive). 무신사가 밝힌 기준은 “1개월 간의 고객 구매·활동 데이터, 성별·카테고리별 TOP 30”입니다.</div>
    <div>‘이유’ 설명은 뉴스·브랜드 공지·무신사 콘텐츠·날씨 기록을 찾아 정리했습니다. 무신사가 공식적으로 밝힌 이유는 아닙니다.</div>
  </footer>
</main>
<div class="tip" id="tip" hidden></div>

<script>
const D = /*__DATA__*/null;
const R = D.reasons || {};
const M = D.months;
// 순서 고정용 배열 (객체로 두면 "100"이 숫자 키라 맨 앞으로 감)
const TOP_ORDER = [["001","상의"],["002","아우터"],["003","바지"],["100","원피스/스커트"]];
const TOP = Object.fromEntries(TOP_ORDER);
const GEN = {A:"전체",M:"남성",F:"여성"};
const ALL_CODE = "000"; // 품목 통합 전체 랭킹 중 의류만 (순위는 무신사 전체 순위 그대로). 순위 찾아보기에서만 씀
const TABS = [["summary","핵심 요약"],["browse","순위 찾아보기"],["steady","꾸준템"],["season","시즌 캘린더"],["month","월별 흐름"],["brand","브랜드 랭킹"]];
const SEASON_OF = m => m>=3&&m<=5?"봄":m>=6&&m<=8?"여름":m>=9&&m<=11?"가을":"겨울";
const SEASONS = [["봄",[3,4,5]],["여름",[6,7,8]],["가을",[9,10,11]],["겨울",[12,1,2]]];

const state = {g:"A", tab:"summary", month:M[M.length-1], cat:"all", bcat:"001", rcat:"001", ball:false, bmore:new Set()}; // ball: 순위 찾아보기에서 그해 모든 달 보기, bmore: 30위까지 펼친 달
try{ const s = JSON.parse(localStorage.getItem("mra-state")||"{}"); if(s.g in GEN) state.g=s.g; }catch(e){}
const h0 = (location.hash||"").slice(1); if(TABS.some(t=>t[0]===h0)) state.tab=h0;

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymLabel = ym => `${ym.slice(0,4)}년 ${+ym.slice(5)}월`;
const ymShort = ym => `${ym.slice(2,4)}.${ym.slice(5)}`;
const P = id => D.products[id] || {n:"(정보 없음)",b:"",c:"",s:""};
const G = () => D.genders[state.g];
// 이 성별에 순위가 있는 대분류만 (남성은 원피스/스커트 순위가 없음)
const topCats = () => TOP_ORDER.filter(([c])=>Object.keys(G().top[c]||{}).length);
const url = id => `https://www.musinsa.com/products/${id}`;
function photo(id, cls=""){
  const p = P(id);
  // 페이지에 넣은 사진(Claude 링크용) → 없으면 무신사 사진 주소(GitHub용)
  const src = (D.imgs||{})[id] || (p.i ? (D.image_host||"https://image.msscdn.net/") + p.i : "");
  return `<div class="ph ${cls}">${src?`<img src="${src}" alt="${esc(p.b+' '+p.n)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<span>${esc((p.b||"?").slice(0,2))}</span></div>`;
}
function level(n){ return n<=0?0:n<=2?1:n<=4?2:n<=7?3:n<=11?4:n<=16?5:6; }
const itemReason = (id, ym) => (ym && R.month_items && R.month_items[`${ym}:${id}`]) || (R.items && R.items[id]) || "";

/* ---------- chrome ---------- */
function chrome(){
  document.getElementById("range").textContent = `${ymLabel(M[0])} – ${ymLabel(M[M.length-1])}`;
  document.getElementById("hero-title").textContent = `${M.length}개월 동안 무신사 월간 TOP 30에 오른 옷들`;
  document.getElementById("gender").innerHTML = Object.entries(GEN).map(([k,v])=>`<button type="button" data-g="${k}" aria-pressed="${state.g===k}">${v}</button>`).join("");
  document.getElementById("tabs").innerHTML = TABS.map(([k,v])=>`<a href="#${k}" data-tab="${k}" ${state.tab===k?'aria-current="page"':""}>${v}</a>`).join("");
  const nProducts = new Set(Object.values(D.genders).flatMap(g=>Object.keys(TOP).flatMap(c=>Object.values(g.top[c]||{}).flat()))).size;
  const nCats = Object.keys(D.categories).length;
  document.getElementById("hero-sub").textContent = R.intro || "무신사 월간 랭킹 아카이브에서 의류(상의·아우터·바지·원피스/스커트)만 골라, 달마다 무엇이 올랐고 왜 올랐는지 정리했습니다.";
  document.getElementById("facts").innerHTML = `<span><b>${M.length}</b>개월</span><span>성별 <b>3</b>개(전체·남·여)</span><span>카테고리 <b>${nCats}</b>개(대분류 4 + 세부)</span><span>대분류 TOP 30에 오른 상품 <b>${nProducts.toLocaleString()}</b>개</span>`;
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-g]"); if(g){ state.g=g.dataset.g; if(state.bcat!==ALL_CODE&&!topCats().some(([c])=>c===state.bcat||D.categories[state.bcat]?.parent===c)) state.bcat="001"; if(state.cat!=="all"&&!topCats().some(([c])=>c===state.cat)) state.cat="all"; try{localStorage.setItem("mra-state",JSON.stringify({g:state.g}))}catch(_){} chrome(); render(); return; }
  const t = e.target.closest("[data-tab]"); if(t){ e.preventDefault(); go(t.dataset.tab); return; }
  const c = e.target.closest("[data-cat]"); if(c){ state.cat=c.dataset.cat; render(); return; }
  const se = e.target.closest("[data-sea]"); if(se){ state.sea=se.dataset.sea; render(); return; }
  const sy = e.target.closest("[data-sy]"); if(sy){ state.sy=sy.dataset.sy; render(); return; }
  const rc = e.target.closest("[data-rcat]"); if(rc){ state.rcat=rc.dataset.rcat; render(); return; }
  const mv = e.target.closest("[data-mstep]"); if(mv){ const i=M.indexOf(state.month)+(+mv.dataset.mstep); if(i>=0&&i<M.length){state.month=M[i]; render();} return; }
  const b = e.target.closest("[data-browse]"); if(b){ state.bcat=b.dataset.browse; go("browse"); return; }
  const bm = e.target.closest("[data-bmore]"); if(bm){ // 펼치기/접기 후 그 달 제목이 화면에서 같은 자리에 오게
    const m = bm.dataset.bmore, head = document.getElementById("bm-"+m), top = head ? head.getBoundingClientRect().top : 0;
    state.bmore.has(m) ? state.bmore.delete(m) : state.bmore.add(m); render();
    const h2 = document.getElementById("bm-"+m); if(h2) window.scrollBy(0, h2.getBoundingClientRect().top - top); return; }
  const bj = e.target.closest("[data-bjump]"); if(bj){ document.getElementById("bm-"+bj.dataset.bjump)?.scrollIntoView({behavior:"smooth"}); return; }
  const gm = e.target.closest("[data-gomonth]"); if(gm){ state.month=gm.dataset.gomonth; go("month"); return; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="msel"){ state.month=e.target.value; render(); }
  if(["bmonth","byear","bcat"].includes(e.target.id)) state.bmore.clear();
  if(e.target.id==="bmonth"){ state.ball = e.target.value==="all"; if(!state.ball) state.month=e.target.value; render(); }
  if(e.target.id==="byear"){ // 같은 달이 그해에 있으면 그 달, 없으면 그해 마지막 달
    const y = e.target.value, same = `${y}-${state.month.slice(5)}`;
    state.month = M.includes(same) ? same : M.filter(m=>m.startsWith(y)).pop(); render(); }
  if(e.target.id==="bcat"){ state.bcat=e.target.value; render(); }
});
function go(tab){ state.tab=tab; history.replaceState(null,"","#"+tab); chrome(); render(); window.scrollTo({top:0}); }

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(html, x, y){ tip.innerHTML=html; tip.hidden=false; const w=tip.offsetWidth, h=tip.offsetHeight; let L=x+14, T=y+14; if(L+w>innerWidth-8) L=x-w-14; if(T+h>innerHeight-8) T=y-h-14; tip.style.left=Math.max(8,L)+"px"; tip.style.top=Math.max(8,T)+"px"; }
document.addEventListener("mouseover", e=>{ const el=e.target.closest("[data-tip]"); if(el) showTip(el.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("mousemove", e=>{ const el=e.target.closest("[data-tip]"); if(el) showTip(el.dataset.tip, e.clientX, e.clientY); else if(!e.target.closest(".kw svg")) tip.hidden=true; });
document.addEventListener("mouseleave", ()=>tip.hidden=true);

/* ---------- views ---------- */
function render(){
  const app = document.getElementById("app");
  const v = {summary, steady, season, month, brand, browse}[state.tab]();
  app.innerHTML = `<section class="view">${v}</section>`;
}

function seasonLeaders(){
  // 세부 종류마다: 계절 평균(대분류 TOP 30 안 개수) ÷ 1년 평균 → 계절성이 가장 뚜렷한 것
  const out = {};
  SEASONS.forEach(([name, months])=>{
    const rows = [];
    Object.entries(G().composition).forEach(([cat, comp])=>{
      Object.entries(comp.calendar).forEach(([sub, cal])=>{
        const vals = cal.filter(v=>v!=null); if(!vals.length) return;
        const year = vals.reduce((a,b)=>a+b,0)/vals.length;
        const s = months.map(m=>cal[m-1]).filter(v=>v!=null);
        const sv = s.reduce((a,b)=>a+b,0)/(s.length||1);
        if(sv>=3 && sv>=year*1.3) rows.push({sub, cat, sv, year, lift: sv/(year||0.1)});
      });
    });
    rows.sort((a,b)=>b.sv-a.sv);
    out[name]=rows.slice(0,6);
  });
  return out;
}

function summary(){
  const f = (R.findings||[]).filter(x=>!x.g || x.g===state.g || x.g==="all");
  const leaders = seasonLeaders();
  return `
  <div class="block">
    <div><div class="eyebrow">${GEN[state.g]} 기준</div><h2>핵심 발견</h2></div>
    ${f.length?`<div class="findings">${f.map((x,k)=>`<article class="finding"><span class="sm-no">${String(k+1).padStart(2,"0")}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p>${(x.ids||[]).length?`<div class="thumbs">${x.ids.slice(0,6).map(id=>`<a href="${url(id)}" target="_blank" rel="noreferrer" title="${esc(P(id).b+' '+P(id).n)}">${photo(id)}</a>`).join("")}</div>`:""}</article>`).join("")}</div>`:`<p class="empty">원인 조사를 정리하는 중입니다.</p>`}
  </div>
  <div class="block">
    <div><h2>계절마다 TOP 30을 채우는 옷</h2><p class="lede">그 계절에 대분류 TOP 30에서 평소보다 자리를 많이 차지하는 옷 종류입니다.</p><details class="how-box"><summary>계산 방법 보기</summary><p>세부 종류가 대분류 TOP 30에서 평균 몇 자리를 차지했는지 계절별로 셌습니다(${M.length}개월 평균). 1년 평균보다 1.3배 이상 많고 3자리 이상인 종류만 보여 줍니다.</p></details></div>
    <div class="seasons">${SEASONS.map(([name,ms])=>`<div class="season"><h3>${name}<small>${ms.join("·")}월</small></h3>${leaders[name].length?`<ol>${leaders[name].map(r=>`<li><span>${esc(r.sub)}<span class="c">${TOP[r.cat]}</span></span><span class="v">${r.sv.toFixed(1)}자리<span class="c">평소 ${r.year.toFixed(1)}</span></span></li>`).join("")}</ol>`:`<p class="empty">뚜렷한 시즌템 없음</p>`}${R.seasons&&R.seasons[name]?`<p class="reason">${esc(R.seasons[name])}</p>`:""}</div>`).join("")}</div>
  </div>`;
}

// 꾸준템 막대: 한 달 = 막대 하나, 높을수록 순위가 높음 (1위 = 꽉 참). 색은 TOP 10 / 11~30위 두 단계만
function sdChart(ranks){
  const jan = i => i>0 && M[i].endsWith("-01");
  return `<div class="sd-chart">
    <div class="sd-axis" aria-hidden="true"><span>1위</span><span>30위</span></div>
    <div class="sd-bars">${ranks.map((r,i)=>`<span class="${jan(i)?"sd-jan":""}" data-tip="${esc(ymLabel(M[i]))} · ${r?r+"위":"TOP 30 밖"}"><i class="${r?(r<=10?"sd-hi":""):"sd-out"}"${r?` style="--sd-h:${(12+(30-r)/29*88).toFixed(0)}%"`:""}></i></span>`).join("")}</div>
    <div class="sd-years" aria-hidden="true">${M.map((ym,i)=>`<span class="${jan(i)?"sd-jan":""}">${i===0||jan(i)?ym.slice(0,4):""}</span>`).join("")}</div>
  </div>`;
}
const sdLegend = `<div class="legend sd-legend"><span>막대가 높을수록 순위가 높습니다</span><span><i style="background:var(--accent)"></i>TOP 10</span><span><i style="background:var(--sd-low)"></i>11–30위</span><span><i class="sd-lg-out"></i>TOP 30 밖</span></div>`;

function steady(){
  const list = G().persistent.filter(p=>state.cat==="all"||p.cat===state.cat).slice(0,30);
  const lastM = M[M.length-1];
  return `
  <div class="block">
    <div><h2>꾸준템: 가장 오래 TOP 30에 머문 옷</h2><p class="lede">대분류(상의·아우터·바지·원피스/스커트) 월간 TOP 30에 든 달이 많은 순서입니다. 그래프는 막대 하나가 한 달이고, 막대가 높을수록 그 달 순위가 높습니다.</p></div>
    <div class="chips">${[["all","전체"],...topCats()].map(([k,v])=>`<button type="button" data-cat="${k}" aria-pressed="${state.cat===k}">${v}</button>`).join("")}</div>
    ${sdLegend}
    <ol class="sd-list">${list.map((p,i)=>{ const q=P(p.id); const why=itemReason(p.id); return `
      <li class="sd-item"><div class="sd-no">${i+1}</div>${photo(p.id)}
        <div class="sd-body">

/* ---------- 계절별 추천 아이템 (디자이너 참고용) ---------- */
const TAG_NAMES = {fit:"핏", silhouette:"실루엣·기장", texture:"원단·가공", detail:"디테일", color:"컬러"};
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
function nextSeason(){ const m = new Date().getMonth()+1; const order=["봄","여름","가을","겨울"]; return order[(order.indexOf(SEASON_OF(m))+1)%4]; }
// 전체: 점수 = 가장 최근 그 계절 평균 자리 × 0.6 + 전체 기간 그 계절 평균 × 0.4
// 연도별: 그해 그 계절 달(겨울은 그해 1·2·12월)의 평균 자리, 비교는 전년 같은 계절
function seasonRecs(seasonName, year){
  const months = SEASONS.find(s=>s[0]===seasonName)[1];
  const inSeason = (ym, y) => months.includes(+ym.slice(5)) && (y==="all" || ym.slice(0,4)===String(y));
  const idx = M.map((ym,i)=>inSeason(ym, year)?i:-1).filter(i=>i>=0);
  if(!idx.length) return [];
  const recent = year==="all" ? idx.slice(-3) : idx;
  const before = year==="all" ? idx.slice(-6,-3) : M.map((ym,i)=>inSeason(ym, +year-1)?i:-1).filter(i=>i>=0);
  const fullBefore = year==="all" ? before.length===3 : before.length===idx.length;
  const cands = [];
  topCats().forEach(([cat,catName])=>{
    const comp = G().composition[cat]; if(!comp) return;
    Object.entries(comp.by_month).forEach(([sub,counts])=>{
      if(sub==="기타") return;
      const all = mean(idx.map(i=>counts[i])), rec = mean(recent.map(i=>counts[i]));
      const prev = fullBefore ? mean(before.map(i=>counts[i])) : null;
      const usual = mean(counts);
      if(all < 2) return;
      cands.push({sub, cat, catName, all, rec, prev, year: usual, score: year==="all" ? rec*0.6 + all*0.4 : all});
    });
  });
  cands.sort((a,b)=>b.score-a.score);
  // 대분류마다 1등 먼저(겨울 아우터처럼 세부 종류가 잘게 나뉜 대분류도 빠지지 않게), 남은 자리는 점수순(대분류당 최대 2개)
  const out = [], perCat = {};
  topCats().forEach(([cat])=>{ const c = cands.find(x=>x.cat===cat); if(c){ out.push(c); perCat[cat]=1; } });
  for(const c of cands){ if(out.length>=5) break; if(out.includes(c) || (perCat[c.cat]||0) >= 2) continue; perCat[c.cat]=(perCat[c.cat]||0)+1; out.push(c); }
  out.sort((a,b)=>b.score-a.score); out.length = Math.min(out.length, 5);
  // 대표 상품과 디자인 키워드: 이 계절 달들의 대분류 TOP 30에서 그 종류 상품을 순위 가중치로 모음
  out.forEach(c=>{
    const w = {};
    idx.forEach(i=>{ ((G().top[c.cat]||{})[M[i]]||[]).forEach((id,r)=>{ if(P(id).s===c.sub) w[id]=(w[id]||0)+(30-r) + (recent.includes(i)?15:0); }); });
    const ids = Object.entries(w).sort((a,b)=>b[1]-a[1]).map(([id])=>id);
    c.ids = ids.slice(0,4);
    c.tags = {};
    Object.keys(TAG_NAMES).forEach(g=>{
      const cnt = {}; let tot = 0;
      ids.forEach(id=>{ ((P(id).k||{})[g]||[]).forEach(v=>{ cnt[v]=(cnt[v]||0)+w[id]; }); tot += w[id]; });
      const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v >= tot*0.12).slice(0,3).map(([k])=>k);
      if(top.length) c.tags[g] = top;
    });
  });
  return out;
}

        <div class="rprods">${c.ids.map(id=>{const q=P(id); return `<a href="${url(id)}" target="_blank" rel="noreferrer" title="${esc(q.b+' '+q.n)}">${photo(id)}<span class="rb">${esc(q.b)}</span></a>`;}).join("")}</div>

/* ---------- 카테고리별 옷 종류 분석 (무신사 랭킹 데이터만: 대분류 TOP 30 + 세부 카테고리 TOP 30) ---------- */
const REC_TOP = 10, REC_PER_TYPE = 3;             // 추천 옷 종류: 개수, 한 종류에서 최대 몇 개
const REC_PROD_TOP = 30, REC_PROD_PER_TYPE = 10;  // 추천 상품: 개수(2026-09-29 사장님: 30까지), 한 종류에서 최대 몇 개
const TYPE_GROUPS = ["silhouette","fit","texture","detail"];   // 옷 종류+디자인 조합에 쓰는 특징 (컬러는 보조 정보로만)
const won = v => v==null ? "-" : v.toLocaleString("ko-KR")+"원";
const manwon = v => (Math.round(v/1000)/10).toString().replace(/\.0$/,"")+"만";
function median(a){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), m=Math.floor(b.length/2); return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2); }
function quant(a,q){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y); return b[Math.min(b.length-1, Math.floor(q*(b.length-1)+0.5))]; }
function subCode(cat, sub){ const e = Object.entries(D.categories).find(([,v])=>v.parent===cat && v.name===sub); return e ? e[0] : null; }
// 계절·연도 → 달 번호들 (seasonRecs와 같은 규칙: 겨울 = 그해 1·2·12월)
function periodIdx(seasonName, year){
  const months = SEASONS.find(x=>x[0]===seasonName)[1];
  const inS = (ym, y) => months.includes(+ym.slice(5)) && (y==="all" || ym.slice(0,4)===String(y));
  const idx = M.map((ym,i)=>inS(ym, year)?i:-1).filter(i=>i>=0);
  const before = year==="all" ? idx.slice(-6,-3) : M.map((ym,i)=>inS(ym, +year-1)?i:-1).filter(i=>i>=0);
  const baseIdx = year==="all" ? idx.slice(-3) : idx;               // 비교할 때 '지금'
  const fullBefore = before.length>0 && before.length===baseIdx.length;
  return {idx, before, baseIdx, fullBefore};
}
// 순위표 가중치: 1위 30점 … 30위 1점, 달마다 더함
function listWeights(code, idxs){ const w={}; idxs.forEach(i=>(((G().top[code]||{})[M[i]])||[]).forEach((id,r)=>{ w[id]=(w[id]||0)+(30-r); })); return w; }
function tagShares(w){ // {group: {tag: 가중 비율}}
  const tot = Object.values(w).reduce((a,b)=>a+b,0) || 1, out = {};
  Object.entries(w).forEach(([id,v])=>{ const k=P(id).k||{}; Object.entries(k).forEach(([g,tags])=>tags.forEach(t=>{ (out[g]=out[g]||{})[t]=((out[g]||{})[t]||0)+v/tot; })); });
  return out;
}
function redundant(tag, sub){ return tag.replace(/ 기장/g,"").split("/").some(part=>part && sub.includes(part.trim())); }
function catTypeData(cat, seasonName, year){
  const {idx, before, baseIdx, fullBefore} = periodIdx(seasonName, year);
  const comp = (G().composition[cat]||{}).by_month || {};
  const types = [];
  Object.entries(comp).forEach(([sub, counts])=>{
    if(sub==="기타") return;
    const avg = mean(idx.map(i=>counts[i])); if(avg < 0.3) return;
    const now = mean(baseIdx.map(i=>counts[i])), was = fullBefore ? mean(before.map(i=>counts[i])) : null;
    const code = subCode(cat, sub);
    const w = code ? listWeights(code, idx) : {};
    const wPrev = code && fullBefore ? listWeights(code, before) : null;
    const shares = tagShares(w), sharesPrev = wPrev ? tagShares(wPrev) : null;
    const ids = Object.keys(w).sort((a,b)=>w[b]-w[a]);
    const prices = ids.map(id=>P(id).p).filter(Boolean);
    const brandW = {}; ids.forEach(id=>{ const b=P(id).b; brandW[b]=(brandW[b]||0)+w[id]; });
    const brands = Object.entries(brandW).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([b])=>b);
    const topTags = TYPE_GROUPS.flatMap(g=>Object.entries(shares[g]||{}).filter(([t])=>!redundant(t,sub)).map(([t,v])=>[t,v])).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t])=>t);
    const color = Object.entries(shares.color||{}).sort((a,b)=>b[1]-a[1])[0];
    types.push({sub, code, avg, now, was, w, ids, shares, sharesPrev, prices, brands, topTags, color: color ? color[0] : null});
  });
  types.sort((a,b)=>b.avg-a.avg);
  // ① 옷 종류 + 디자인 조합: 종류가 대분류 TOP 30에서 차지한 평균 자리 × 그 종류 세부 TOP 30 안에서 그 특징을 가진 비율(순위 가중)
  const combos = [];
  types.forEach(t=>{
    const cands = [];
    TYPE_GROUPS.forEach(g=>Object.entries(t.shares[g]||{}).forEach(([tag, share])=>{
      if(share < 0.2 || redundant(tag, t.sub)) return;
      const prev = t.sharesPrev ? ((t.sharesPrev[g]||{})[tag]||0) : null;
      cands.push({g, tag, share, prev, est: t.avg*share});
    }));
    cands.sort((a,b)=>b.est-a.est).slice(0,REC_PER_TYPE).forEach(c=>combos.push({...c, t}));
  });
  combos.sort((a,b)=>b.est-a.est);
  const comboPicks = combos.slice(0,REC_TOP).map(c=>{
    const ids = c.t.ids.filter(id=>((P(id).k||{})[c.g]||[]).includes(c.tag));
    const other = {}; ["silhouette","fit","texture","detail","color"].filter(g=>g!==c.g).forEach(g=>{
      const cnt={}; let tot=0; ids.forEach(id=>{ ((P(id).k||{})[g]||[]).forEach(v=>{ cnt[v]=(cnt[v]||0)+c.t.w[id]; }); tot+=c.t.w[id]; });
      const top = Object.entries(cnt).filter(([v,n])=>n>=tot*0.2 && !redundant(v,c.t.sub)).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([v])=>v);
      if(top.length) other[g]=top;
    });
    return {...c, name: `${c.tag.replace(/ 기장$/,"")} ${c.t.sub}`, ids: ids.slice(0,4), prices: ids.map(id=>P(id).p).filter(Boolean), other};
  });
  // ② 개별 상품: 이 기간 대분류 TOP 30 순위 가중치 합, 판매 종료 제외, 한 종류에서 최대 REC_PROD_PER_TYPE개
  const wCat = listWeights(cat, idx), perSub = {}, prodPicks = [];
  Object.keys(wCat).sort((a,b)=>wCat[b]-wCat[a]).forEach(id=>{
    const q = P(id); if(q.x || prodPicks.length>=REC_PROD_TOP) return;
    if((perSub[q.s]||0) >= REC_PROD_PER_TYPE) return; perSub[q.s]=(perSub[q.s]||0)+1;
    let months = 0, best = 99; idx.forEach(i=>{ const r=(((G().top[cat]||{})[M[i]])||[]).indexOf(id); if(r>=0){ months++; best=Math.min(best,r+1); } });
    prodPicks.push({id, months, best, total: idx.length});
  });
  return {types, comboPicks, prodPicks, fullBefore, hasData: idx.length>0};
}
function catTypeBlock(){

    ${d.comboPicks.length?`<ol class="recs">${d.comboPicks.map((c,k)=>`<li class="rec">
      <div class="rhead"><span class="rk">${k+1}</span><div><h3>${esc(c.name)}</h3><div class="rmeta">${esc(c.t.sub)} 세부 TOP 30의 <b>${Math.round(c.share*100)}%</b>가 '${esc(c.tag)}' · 종류 평균 ${c.t.avg.toFixed(1)}자리 ${tr(c.share, c.prev, "%p")}</div></div></div>
      <dl class="tags">${c.prices.length?`<div><dt>정가</dt><dd>중간 ${won(median(c.prices))}</dd></div>`:""}${Object.entries(c.other).map(([g,v])=>`<div><dt>${TAG_NAMES[g]}</dt><dd>${v.map(esc).join(" · ")}</dd></div>`).join("")}</dl>
      <div class="rprods">${c.ids.map(id=>{const q=P(id); return `<a href="${url(id)}" target="_blank" rel="noreferrer" title="${esc(q.b+' '+q.n)}">${photo(id)}<span class="rb">${esc(q.b)}</span></a>`;}).join("")}</div>
    </li>`).join("")}</ol>`:`<p class="empty">뚜렷한 조합이 없습니다.</p>`}
    <div><h3 class="cz-h">추천 상품 TOP ${REC_PROD_TOP}: 이 기간 ${catName} TOP 30 성적순</h3><p class="bfoot">이 기간 대분류 TOP 30 순위를 점수로 더했습니다(1위 30점 … 30위 1점). 판매 종료 상품은 빼고, 한 종류에서 최대 ${REC_PROD_PER_TYPE}개.${d.prodPicks.length<REC_PROD_TOP?` 이 기간은 조건에 맞는 상품이 ${d.prodPicks.length}개입니다.`:""}</p></div>
    <ol class="cz-prods">${d.prodPicks.map((x,k)=>{const q=P(x.id); const kw=Object.entries(q.k||{}).flatMap(([,v])=>v).slice(0,4); return `<li><a href="${url(x.id)}" target="_blank" rel="noreferrer">${photo(x.id)}</a>
      <div class="cz-pinfo"><span class="cz-rk">${k+1}</span><span class="pbrand">${esc(q.b)} · ${esc(q.s)}</span><a class="pname" href="${url(x.id)}" target="_blank" rel="noreferrer">${esc(q.n)}</a>
      <span class="cz-pmeta">${x.months}/${x.total}개월 TOP 30 · 최고 ${x.best}위${q.p?` · 정가 ${won(q.p)}`:""}</span>${kw.length?`<span class="cz-kw">${kw.map(esc).join(" · ")}</span>`:""}</div></li>`;}).join("")}</ol>`}
  </div>`;
}

function season(){
  return `${seasonRecBlock()}${catTypeBlock()}`;
}

function month(){
  const ym = state.month, i = M.indexOf(ym);
  const ctx = (R.months||{})[ym] || {};
  const notable = (G().notable[ym]||[]);
  const KIND = {"신규 진입":"new","재진입":"re","급상승":"up"};
  return `
  <div class="block">
    <div class="month-nav">
      <button type="button" data-mstep="-1" ${i<=0?"disabled":""} aria-label="이전 달">‹</button>
      <select id="msel" aria-label="달 선택">${M.map(m=>`<option value="${m}" ${m===ym?"selected":""}>${ymLabel(m)}</option>`).join("")}</select>
      <button type="button" data-mstep="1" ${i>=M.length-1?"disabled":""} aria-label="다음 달">›</button>
    </div>
    <div class="context">
      <div class="eyebrow">${ymLabel(ym)}의 배경</div>
      ${ctx.summary?`<p>${esc(ctx.summary)}</p>`:`<p class="empty">이 달 배경은 아직 정리 전입니다.</p>`}
      ${(ctx.points||[]).length?`<ul>${ctx.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
      ${(ctx.sources||[]).length?`<div class="sources">출처 ${ctx.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)}</a>`).join("")}</div>`:""}
    </div>
  </div>
  <div class="block">
    <div><h2>이달 새로 뜬 옷</h2><p class="lede">${GEN[state.g]} 대분류 TOP 30에 처음 들어왔거나(신규), 빠졌다 돌아왔거나(재진입), 지난달보다 10계단 넘게 오른(급상승) 상품입니다.</p></div>
    ${i===0?`<p class="empty">첫 달이라 비교할 지난달이 없습니다.</p>`:notable.length?`<div class="cards">${notable.map(c=>{const q=P(c.id); const why=itemReason(c.id, ym); return `<div class="card">${photo(c.id)}<div class="pbody"><div><span class="badge ${KIND[c.kind]}">${c.kind}</span><span class="pmeta"><span><b>${c.rank}</b>위${c.prev?` (지난달 ${c.prev}위)`:""} · ${TOP[q.c]||""}</span></span></div><div class="pbrand">${esc(q.b)} · ${esc(q.s)}</div><div class="pname"><a href="${url(c.id)}" target="_blank" rel="noreferrer">${esc(q.n)}</a></div>${why?`<p class="reason">${esc(why)}</p>`:""}</div></div>`;}).join("")}</div>`:`<p class="empty">큰 변화 없이 지난달 상품이 그대로 유지된 달입니다.</p>`}
  </div>
  <div class="block">
    <h2>${ymLabel(ym)} 대분류 TOP 5</h2>
    <div class="tops">${topCats().map(([cat,name])=>{ const ids=(G().top[cat]||{})[ym]||[]; return `<div class="topcol"><h3>${name}<button type="button" class="linkbtn" data-browse="${cat}">30위까지 ›</button></h3>${ids.slice(0,5).map((id,k)=>{const q=P(id); return `<a class="mini" href="${url(id)}" target="_blank" rel="noreferrer"><span class="r">${k+1}</span>${photo(id)}<span class="mt"><span class="mb">${esc(q.b)}</span><span class="nm">${esc(q.n)}</span></span></a>`;}).join("")||'<p class="empty">자료 없음</p>'}</div>`;}).join("")}</div>
  </div>`;
}

// 막대 한 줄: 이름 | 막대(+ 비교 세로선) | 값 | 변화
function barRow(no, name, val, max, unit, cmp, tip){
  const w = max>0 ? Math.max(1.5, val/max*100) : 0, cw = cmp==null||max<=0 ? null : Math.min(100, cmp/max*100);
  const d = cmp==null ? null : val-cmp;
  const dTxt = d==null ? "<span></span>" : Math.abs(d) < 0.5 ? `<span class="dl">–</span>` : `<span class="dl ${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d).toFixed(0)}${unit==="%"?"%p":""}</span>`;
  return `<div class="barrow" data-tip="${esc(tip)}"><span class="bd-no">${no}</span><span class="bn">${esc(name)}</span><span class="bt"><i style="width:${w.toFixed(1)}%"></i>${cw!=null?`<b style="left:${cw.toFixed(1)}%" aria-hidden="true"></b>`:""}</span><span class="bv">${unit==="%"?val.toFixed(0)+"%":val+"<small>자리</small>"}</span>${dTxt}</div>`;
}
function brand(){
  const B = G().brands, n = M.length;
  const sum = (a, ids) => ids.reduce((x,i)=>x+(a[i]||0),0);
  const r6 = [0,1,2,3,4,5].map(k=>n-6+k).filter(i=>i>=0), p6 = [0,1,2,3,4,5].map(k=>n-12+k).filter(i=>i>=0);
  const totals = [...B].sort((a,b)=>b.total-a.total).slice(0,15);
  const maxT = Math.max(1, ...totals.map(b=>b.total));
  const rising = n>=12 ? B.map(b=>({b, now: sum(b.counts, r6), was: sum(b.counts, p6)})).filter(x=>x.now>=4 && x.now > x.was).sort((a,b)=>(b.now-b.was)-(a.now-a.was)).slice(0,10) : [];
  const maxR = Math.max(1, ...rising.map(x=>Math.max(x.now,x.was)));
  return `
  <div class="block">
    <div><h2>브랜드 랭킹</h2><p class="lede">브랜드마다 대분류 TOP 30에 상품을 몇 자리 올렸는지 셌습니다. 한 상품이 여러 달 들면 달마다 셉니다.</p>${R.brands_note?`<div class="note">${esc(R.brands_note)}</div>`:""}</div>
    <div class="bgrid two">
      <div class="bgroup"><h3>${n}개월 누적 TOP 15</h3>${totals.map((b,k)=>barRow(k+1, b.brand, b.total, maxT, "", null, `${b.brand}: ${n}개월 합계 ${b.total}자리`)).join("")}</div>
      <div class="bgroup"><h3>최근 6개월 뜨는 브랜드</h3>${rising.length?rising.map((x,k)=>barRow(k+1, x.b.brand, x.now, maxR, "", x.was, `${x.b.brand}: 최근 6개월 ${x.now}자리 · 그 전 6개월 ${x.was}자리`)).join(""):`<p class="empty">비교할 기간이 부족합니다.</p>`}<p class="bfoot">막대 = 최근 6개월(${ymShort(M[r6[0]])}~${ymShort(M[n-1])}), 세로 선 = 그 전 6개월</p></div>
    </div>
  </div>`;
}

// 한 달치 순위표 (등락은 바로 전달과 비교). limit이 있으면 그 줄까지만 + '30위까지 보기' 버튼
function rankTable(ym, limit){
  const row = (id, rank, st="", cls="") => { const q=P(id); return `<div class="rrow"><span class="r">${rank}</span>${photo(id)}<span class="bw-info"><a class="bw-name" href="${url(id)}" target="_blank" rel="noreferrer">${esc(q.n)}</a><span class="pbrand">${esc(q.b)}${q.x?" · 판매 종료":""}</span>${q.p?`<span class="rprice">정가 ${q.p.toLocaleString("ko-KR")}원</span>`:""}</span><span class="st ${cls}">${st}</span></div>`; };
  if(state.bcat===ALL_CODE){ // 전체 랭킹: 의류만, 순위와 아이템만 (등락 표시 없음)
    const all = (G().overall||{})[ym]||[], list = limit ? all.slice(0, limit) : all;
    const toggle = state.ball && all.length > 10
      ? `<button type="button" class="bmore-btn" data-bmore="${ym}">${limit ? `의류 ${all.length}개 모두 보기 ›` : "10개만 보기 ‹"}</button>` : "";
    return list.length?`<div class="rank-table">${list.map(([rank,id])=>row(id, rank)).join("")}</div>${toggle}`:`<p class="empty">이 달 전체 랭킹 TOP 30에는 의류가 없습니다.</p>`;
  }
  const i = M.indexOf(ym), prev = i>0?M[i-1]:null, byMonth = G().top[state.bcat]||{};
  const all = byMonth[ym]||[];
  const ids = limit ? all.slice(0, limit) : all;
  const toggle = state.ball && all.length > 10
    ? `<button type="button" class="bmore-btn" data-bmore="${ym}">${limit ? `${all.length}위까지 보기 ›` : "10위까지 접기 ‹"}</button>` : "";
  const prevIds = prev?(byMonth[prev]||[]):null;
  const seenBefore = id => M.slice(0,i).some(m=>(byMonth[m]||[]).includes(id));
  return ids.length?`<div class="rank-table">${ids.map((id,k)=>{let st="", cls=""; if(prevIds){ const pi=prevIds.indexOf(id); if(pi<0){ if(seenBefore(id)){st="재진입";cls="re";} else {st="신규";cls="new";} } else { const d=pi-k; st=d>0?`▲${d}`:d<0?`▼${-d}`:"–"; cls=d>=10?"up":""; } } return row(id, k+1, st, cls);}).join("")}</div>${toggle}`:`<p class="empty">이 달·카테고리는 무신사 아카이브에 순위가 없습니다.</p>`;
}

function browse(){
  const ym = state.month, yr = ym.slice(0,4), yearMonths = M.filter(m=>m.startsWith(yr));
  const cats = D.categories;
  const opts = (G().overall?`<option value="${ALL_CODE}" ${state.bcat===ALL_CODE?"selected":""}>전체 랭킹 (품목 통합 · 의류만)</option>`:"") + topCats().map(([code,name])=>`<optgroup label="${name}"><option value="${code}" ${state.bcat===code?"selected":""}>${name} 전체</option>${Object.entries(cats).filter(([,c])=>c.parent===code).map(([sc,c])=>`<option value="${sc}" ${state.bcat===sc?"selected":""}>${esc(c.name)}</option>`).join("")}</optgroup>`).join("");
  return `
  <div class="block">
    <div><h2>순위 찾아보기</h2><p class="lede">연도·달·카테고리를 골라 무신사 월간 TOP 30을 봅니다. 달에서 '전체'를 고르면 그해 달마다 TOP 10이 이어서 나옵니다.</p><details class="how-box"><summary>보는 법 자세히</summary><p>카테고리 맨 위 '전체 랭킹'은 품목을 나누지 않은 무신사 전체 TOP 30에서 옷만 남긴 것입니다. 순위는 무신사 전체 순위 그대로라서 신발·가방·소품이 있던 자리는 비어 있고 달마다 개수가 다릅니다.</p><p>세부 카테고리(니트, 패딩, 데님 팬츠 등)도 고를 수 있습니다. 달 '전체'에서는 '30위까지 보기'로 펼칩니다.</p>${(D.price_dates||[]).length?`<p>정가는 ${D.price_dates[1].slice(0,4)}년 ${+D.price_dates[1].slice(5,7)}월 무신사 상품 페이지에서 조회한 값입니다(그 달 당시 가격이 아님). 아직 받지 못한 상품은 비어 있습니다.</p>`:""}</details></div>
    <div class="filters">
      <label class="bw-field">연도<select id="byear">${[...new Set(M.map(m=>m.slice(0,4)))].map(y=>`<option value="${y}" ${ym.startsWith(y)?"selected":""}>${y}년</option>`).join("")}</select></label>
      <label class="bw-field">달<select id="bmonth"><option value="all" ${state.ball?"selected":""}>전체</option>${yearMonths.map(m=>`<option value="${m}" ${!state.ball&&m===ym?"selected":""}>${+m.slice(5)}월</option>`).join("")}</select></label>
      <label class="bw-field">카테고리<select id="bcat">${opts}</select></label>
      ${state.ball?"":`<button type="button" class="linkbtn" data-gomonth="${ym}">이 달 배경 보기 ›</button>`}
    </div>
    ${state.ball?`
    <div class="chips" aria-label="달로 이동">${yearMonths.map(m=>`<button type="button" data-bjump="${m}">${+m.slice(5)}월</button>`).join("")}</div>
    ${yearMonths.length<12?`<p class="bfoot">${yr}년은 ${yearMonths.map(m=>+m.slice(5)+"월").join("·")} 자료만 있습니다.</p>`:""}
    <div>${yearMonths.map(m=>`<div class="mhead" id="bm-${m}"><h3>${ymLabel(m)}</h3><button type="button" class="linkbtn" data-gomonth="${m}">이 달 배경 보기 ›</button></div>${rankTable(m, state.bmore.has(m) ? null : 10)}`).join("")}</div>`
    : rankTable(ym)}
  </div>`;
}

chrome(); render();
</script>
