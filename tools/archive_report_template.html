<title>무신사 의류 랭킹 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --page:#f3f4f2; --surface:#fcfcfb; --surface-2:#eceeeb;
  --ink:#111315; --ink-2:#4f5256; --muted:#85888b; --hair:#dfe1dd; --axis:#c3c5c0;
  --accent:#1c5cab; --accent-soft:#e3edf9;
  --new:#1c5cab; --re:#6b4fa8; --up:#1d7a4a;
  --h0:#e9ebe7; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#256abf; --h6:#104281;
  --tip-bg:#111315; --tip-ink:#fcfcfb; --heat-hi-ink:#fff;
  --sans:"IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0f1011; --surface:#18191a; --surface-2:#222325;
    --ink:#f1f1ef; --ink-2:#c2c3be; --muted:#8a8c8c; --hair:#2c2d2e; --axis:#3a3b3c;
    --accent:#86b6ef; --accent-soft:#16243a;
    --new:#86b6ef; --re:#b3a4ec; --up:#5cc98d;
    --h0:#232425; --h1:#1d3f6e; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#b7d3f6;
    --tip-bg:#f1f1ef; --tip-ink:#111315; --heat-hi-ink:#0f1011;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f1011; --surface:#18191a; --surface-2:#222325;
  --ink:#f1f1ef; --ink-2:#c2c3be; --muted:#8a8c8c; --hair:#2c2d2e; --axis:#3a3b3c;
  --accent:#86b6ef; --accent-soft:#16243a;
  --new:#86b6ef; --re:#b3a4ec; --up:#5cc98d;
  --h0:#232425; --h1:#1d3f6e; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#b7d3f6;
  --tip-bg:#f1f1ef; --tip-ink:#111315; --heat-hi-ink:#0f1011;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:1px solid var(--hair)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandline{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brandline span{color:var(--muted);font-weight:400;margin-left:8px;font-size:13px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;padding:5px 14px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--hair)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink-2);font-size:14px;padding:8px 12px 10px;border-bottom:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{padding-block:36px 20px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(26px,4.2vw,40px);line-height:1.2;letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);max-width:68ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.facts b{font-family:var(--mono);color:var(--ink);font-weight:500}

section.view{display:flex;flex-direction:column;gap:28px;padding-top:8px}
h2{font-size:21px;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;text-wrap:balance}
.lede{color:var(--ink-2);margin:4px 0 0;max-width:72ch}
.block{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* findings */
.findings{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.finding{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.finding p{margin:0;color:var(--ink-2);font-size:14px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .ph{width:52px;height:62px}

/* season board */
.seasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.season{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.season h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.season ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.season li{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13.5px;align-items:baseline}
.season li .v{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.season li .c{color:var(--muted);font-size:11.5px;display:block}
@media (max-width:820px){.seasons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.seasons{grid-template-columns:1fr}}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}

/* product photo */
.ph{position:relative;flex:none;width:64px;height:76px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* persistent list */
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);border-radius:10px}
.prow{display:grid;grid-template-columns:28px 64px minmax(0,1fr);gap:14px;padding:14px 16px;border-top:1px solid var(--hair)}
.prow:first-child{border-top:0}
.prow .no{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:2px}
.pbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.pname{font-size:14.5px;font-weight:500;line-height:1.4}
.pname a{text-decoration:none}
.pname a:hover{text-decoration:underline}
.pbrand{color:var(--muted);font-size:12.5px}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.pmeta b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.reason{font-size:13.5px;color:var(--ink-2);margin:0;max-width:78ch}
.reason::before{content:"왜? ";font-weight:700;color:var(--accent)}
.strip-wrap{overflow-x:auto}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(9px,1fr);gap:2px;min-width:300px;max-width:560px}
.strip i{height:14px;border-radius:2px;background:var(--h0)}
.strip-years{display:grid;grid-auto-flow:column;gap:2px;min-width:300px;max-width:560px;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:12px;border-radius:2px;display:inline-block}

/* heatmap */
.heat-card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.heat-scroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
table.heat th{font-weight:400;color:var(--muted);white-space:nowrap}
table.heat th.row{text-align:right;padding-right:8px;color:var(--ink-2);font-size:12.5px;position:sticky;left:0;background:var(--surface);z-index:1}
table.heat thead th{font-family:var(--mono);font-size:10.5px;text-align:center;height:18px}
table.heat thead th.y{text-align:left;color:var(--ink-2)}
table.heat td{width:20px;min-width:20px;height:20px;border-radius:3px;background:var(--h0);text-align:center;font-family:var(--mono);font-size:10px;color:transparent;cursor:default}
table.heat td.gap{background:transparent;width:6px;min-width:6px}
table.heat td[data-l="4"]{color:#fff} table.heat td[data-l="5"],table.heat td[data-l="6"]{color:var(--heat-hi-ink)}
table.heat td:hover{outline:2px solid var(--ink);outline-offset:0}
.note{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ink);max-width:80ch}

/* season calendar (list) */
.profile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.profile{grid-template-columns:1fr}}
.pcol{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcol ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pcol li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:14px}
.pcol .pm{color:var(--muted);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;align-self:center}
.dot-s{background:var(--accent)} .dot-a{background:var(--muted)}
.slist{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:4px 18px 10px}
.slist h3.yr{font-size:15px;padding:14px 0 4px;font-family:var(--mono);font-weight:500}
.srow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid var(--hair)}
.slist .srow:first-child{border-top:0}
.sm{display:flex;flex-direction:column;line-height:1.25}
.sm b{font-size:15px} .sm span{font-size:12px;color:var(--muted)}
.sbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.sbars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:6px 22px;align-content:start}
@media (max-width:760px){.sbars{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}}
.sb{display:grid;grid-template-columns:minmax(0,10.5em) minmax(40px,1fr) 2em;align-items:center;gap:8px;font-size:13.5px}
.sl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strack{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.strack i{display:block;height:100%;background:var(--axis);border-radius:3px}
.sb.is-season .strack i{background:var(--accent)} .sb.is-always .strack i{background:var(--muted)}
.sb.is-season .sl{font-weight:700}
.sn{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.more{font-size:12px;color:var(--muted)}

/* category type analysis (cz-) */
.cz-card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px}
.cz-card h3{font-size:15px;margin-bottom:6px}
.cz-row{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-top:1px solid var(--hair)}
.cz-row:nth-of-type(1){border-top:0}
.cz-main{display:grid;grid-template-columns:minmax(0,10em) minmax(60px,1fr) 2.6em auto;align-items:center;gap:10px;font-size:14px}
.cz-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-bar{position:relative;height:12px;background:var(--surface-2);border-radius:3px}
.cz-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.cz-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.cz-val{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.cz-sub{font-size:12.5px;color:var(--muted);padding-left:0}
.cz-h{font-size:16px;margin-top:6px}
.cz-prods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cz-prods li{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cz-prods .ph{width:100%;height:auto;aspect-ratio:5/6}
.cz-pinfo{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.cz-pinfo .pname{text-decoration:none;font-weight:500;line-height:1.35}
.cz-rk{font-family:var(--mono);color:var(--accent);font-weight:500}
.cz-pmeta{font-size:12px;color:var(--ink-2)}
.cz-kw{font-size:12px;color:var(--muted)}
@media (max-width:560px){.cz-main{grid-template-columns:minmax(0,7em) minmax(40px,1fr) 2.4em;} .cz-main .tr{grid-column:1/-1;margin-left:0}}

/* month view */
.month-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.month-nav button,select{font:inherit;font-size:14px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.month-nav button:disabled{opacity:.35;cursor:default}
.context{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.context p{margin:0;max-width:80ch}
.context ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.sources{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.sources a{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid currentColor;margin-right:6px}
.badge.new{color:var(--new)} .badge.re{color:var(--re)} .badge.up{color:var(--up)}
.tops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.tops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tops{grid-template-columns:1fr}}
.topcol{display:flex;flex-direction:column;gap:8px}
.topcol h3{font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.topcol h3 button{font:inherit;font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.mini{display:grid;grid-template-columns:18px 44px minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px;line-height:1.35}
.mini .ph{width:44px;height:52px}
.mini .r{font-family:var(--mono);color:var(--muted);text-align:right}
.mini .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.mini .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .mb{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* season recommendations */
.chips button small{color:inherit;opacity:.7;font-size:11.5px}
.recs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.rec{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rhead{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.rk{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--accent);line-height:1.1}
.rhead h3{font-size:17px}
.rmeta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.rmeta b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.tr{display:inline-block;font-size:11.5px;font-weight:700;margin-left:4px;color:var(--muted)}
.tr.up{color:var(--up)} .tr.down{color:var(--re)}
.tags{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.tags div{display:contents}
.tags dt{color:var(--muted)} .tags dd{margin:0}
.rprods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rprods a{text-decoration:none;display:flex;flex-direction:column;gap:4px;min-width:0}
.rprods .ph{width:100%;height:auto;aspect-ratio:5/6}
.rb{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.recs{grid-template-columns:1fr}}
/* bars (keyword & brand) */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.bgroup{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.bgroup h3{font-size:15px;margin-bottom:4px}
.barrow{display:grid;grid-template-columns:minmax(0,7.5em) minmax(60px,1fr) 3em 3.6em;align-items:center;gap:10px;font-size:13.5px}
.barrow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bt{position:relative;height:12px;background:var(--surface-2);border-radius:3px}
.barrow .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.barrow .bt b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.barrow .bv{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.dl{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dl.up,.up-t{color:var(--up)} .dl.down,.down-t{color:var(--re)}
.legend i.mk{width:2px;height:14px;background:var(--ink);border-radius:0}
.bfoot{font-size:12px;color:var(--muted);margin:4px 0 0}
.bgrid.two{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.bgrid.two .barrow{grid-template-columns:minmax(0,10.5em) minmax(60px,1fr) 3em 3.6em}
@media (max-width:420px){.bgrid{grid-template-columns:1fr}.barrow{grid-template-columns:minmax(0,6em) minmax(40px,1fr) 2.6em 3.2em;gap:6px}}

/* keyword small multiples */
.kw-group{display:flex;flex-direction:column;gap:10px}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kw{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px}
.kw-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.kw-head span{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kw svg{width:100%;height:46px;display:block;overflow:visible}
.kw .ln{fill:none;stroke:var(--h5);stroke-width:2;stroke-linejoin:round}
.kw .ar{fill:var(--h1);opacity:.7}
.kw .dt{fill:var(--h5);stroke:var(--surface);stroke-width:2}
.kw .yr{stroke:var(--hair);stroke-width:1}
.kw .hv{stroke:var(--ink);stroke-width:1;opacity:0}
.kw-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--mono)}

/* browse */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rank-table{background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.rrow{display:grid;grid-template-columns:34px 44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--hair);font-size:13.5px}
.rrow:first-child{border-top:0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 8px;scroll-margin-top:12px}
.mhead:first-child{margin-top:0}
.mhead button{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer}
.bmore-btn{display:block;width:100%;margin-top:6px;padding:9px 12px;font:inherit;font-size:13.5px;color:var(--accent);background:var(--surface);border:1px solid var(--hair);border-radius:8px;cursor:pointer}
.bmore-btn:hover{background:var(--accent-soft)}

@media (prefers-reduced-motion:no-preference){ .view{animation:fade .18s ease-out} @keyframes fade{from{opacity:.4}to{opacity:1}} }
</style>

<header class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="brandline">무신사 의류 랭킹 분석<span id="range"></span></div>
      <div class="seg" role="group" aria-label="성별" id="gender"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="보기"></nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 id="hero-title">무신사 월간 TOP 30에 오른 옷들</h1>
    <p id="hero-sub"></p>
    <div class="facts" id="facts"></div>
  </div>
  <div id="app"></div>
  <footer>
    <div>자료: 무신사 월간 랭킹 아카이브(www.musinsa.com/ranking/archive). 무신사가 밝힌 기준은 “1개월 간의 고객 구매·활동 데이터, 성별·카테고리별 TOP 30”입니다.</div>
    <div>‘왜?’ 설명은 뉴스·브랜드 공지·무신사 콘텐츠·날씨 기록을 찾아 정리한 것으로, 무신사가 공식적으로 밝힌 이유가 아닙니다.</div>
  </footer>
</main>
<div class="tip" id="tip" hidden></div>

<script>
const D = /*__DATA__*/null;
const R = D.reasons || {};
const M = D.months;
// 순서 고정용 배열 (객체로 두면 "100"이 숫자 키라 맨 앞으로 감)
const TOP_ORDER = [["001","상의"],["002","아우터"],["003","바지"],["100","원피스/스커트"]];
const TOP = Object.fromEntries(TOP_ORDER);
const GEN = {A:"전체",M:"남성",F:"여성"};
const TABS = [["summary","핵심 요약"],["browse","순위 찾아보기"],["steady","꾸준템"],["season","시즌 캘린더"],["month","월별 흐름"],["brand","브랜드 랭킹"]];
const SEASON_OF = m => m>=3&&m<=5?"봄":m>=6&&m<=8?"여름":m>=9&&m<=11?"가을":"겨울";
const SEASONS = [["봄",[3,4,5]],["여름",[6,7,8]],["가을",[9,10,11]],["겨울",[12,1,2]]];

const state = {g:"A", tab:"summary", month:M[M.length-1], cat:"all", bcat:"001", scat:"001", rcat:"001", ball:false, bmore:new Set()}; // ball: 순위 찾아보기에서 그해 모든 달 보기, bmore: 30위까지 펼친 달
try{ const s = JSON.parse(localStorage.getItem("mra-state")||"{}"); if(s.g in GEN) state.g=s.g; }catch(e){}
const h0 = (location.hash||"").slice(1); if(TABS.some(t=>t[0]===h0)) state.tab=h0;

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymLabel = ym => `${ym.slice(0,4)}년 ${+ym.slice(5)}월`;
const ymShort = ym => `${ym.slice(2,4)}.${ym.slice(5)}`;
const P = id => D.products[id] || {n:"(정보 없음)",b:"",c:"",s:""};
const G = () => D.genders[state.g];
// 이 성별에 순위가 있는 대분류만 (남성은 원피스/스커트 순위가 없음)
const topCats = () => TOP_ORDER.filter(([c])=>Object.keys(G().top[c]||{}).length);
const url = id => `https://www.musinsa.com/products/${id}`;
function photo(id, cls=""){
  const p = P(id);
  // 페이지에 넣은 사진(Claude 링크용) → 없으면 무신사 사진 주소(GitHub용)
  const src = (D.imgs||{})[id] || (p.i ? (D.image_host||"https://image.msscdn.net/") + p.i : "");
  return `<div class="ph ${cls}">${src?`<img src="${src}" alt="${esc(p.b+' '+p.n)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<span>${esc((p.b||"?").slice(0,2))}</span></div>`;
}
function level(n){ return n<=0?0:n<=2?1:n<=4?2:n<=7?3:n<=11?4:n<=16?5:6; }
function rankLevel(r){ return r==null?0:r<=3?6:r<=5?5:r<=10?4:r<=20?3:2; }
const itemReason = (id, ym) => (ym && R.month_items && R.month_items[`${ym}:${id}`]) || (R.items && R.items[id]) || "";

/* ---------- chrome ---------- */
function chrome(){
  document.getElementById("range").textContent = `${ymLabel(M[0])} – ${ymLabel(M[M.length-1])}`;
  document.getElementById("hero-title").textContent = `${M.length}개월 동안 무신사 월간 TOP 30에 오른 옷들`;
  document.getElementById("gender").innerHTML = Object.entries(GEN).map(([k,v])=>`<button type="button" data-g="${k}" aria-pressed="${state.g===k}">${v}</button>`).join("");
  document.getElementById("tabs").innerHTML = TABS.map(([k,v])=>`<a href="#${k}" data-tab="${k}" ${state.tab===k?'aria-current="page"':""}>${v}</a>`).join("");
  const nProducts = new Set(Object.values(D.genders).flatMap(g=>Object.keys(TOP).flatMap(c=>Object.values(g.top[c]||{}).flat()))).size;
  const nCats = Object.keys(D.categories).length;
  document.getElementById("hero-sub").textContent = R.intro || "무신사 월간 랭킹 아카이브에서 의류(상의·아우터·바지·원피스/스커트)만 골라, 달마다 무엇이 올랐고 왜 올랐는지 정리했습니다.";
  document.getElementById("facts").innerHTML = `<span><b>${M.length}</b>개월</span><span>성별 <b>3</b>개(전체·남·여)</span><span>카테고리 <b>${nCats}</b>개(대분류 4 + 세부)</span><span>대분류 TOP 30에 오른 상품 <b>${nProducts.toLocaleString()}</b>개</span>`;
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-g]"); if(g){ state.g=g.dataset.g; if(!topCats().some(([c])=>c===state.bcat||D.categories[state.bcat]?.parent===c)) state.bcat="001"; if(state.cat!=="all"&&!topCats().some(([c])=>c===state.cat)) state.cat="all"; try{localStorage.setItem("mra-state",JSON.stringify({g:state.g}))}catch(_){} chrome(); render(); return; }
  const t = e.target.closest("[data-tab]"); if(t){ e.preventDefault(); go(t.dataset.tab); return; }
  const c = e.target.closest("[data-cat]"); if(c){ state.cat=c.dataset.cat; render(); return; }
  const sc = e.target.closest("[data-scat]"); if(sc){ state.scat=sc.dataset.scat; render(); return; }
  const se = e.target.closest("[data-sea]"); if(se){ state.sea=se.dataset.sea; render(); return; }
  const sy = e.target.closest("[data-sy]"); if(sy){ state.sy=sy.dataset.sy; render(); return; }
  const rc = e.target.closest("[data-rcat]"); if(rc){ state.rcat=rc.dataset.rcat; render(); return; }
  const sly = e.target.closest("[data-sly]"); if(sly){ state.sly=sly.dataset.sly; render(); return; }
  const mv = e.target.closest("[data-mstep]"); if(mv){ const i=M.indexOf(state.month)+(+mv.dataset.mstep); if(i>=0&&i<M.length){state.month=M[i]; render();} return; }
  const b = e.target.closest("[data-browse]"); if(b){ state.bcat=b.dataset.browse; go("browse"); return; }
  const bm = e.target.closest("[data-bmore]"); if(bm){ // 펼치기/접기 후 그 달 제목이 화면에서 같은 자리에 오게
    const m = bm.dataset.bmore, head = document.getElementById("bm-"+m), top = head ? head.getBoundingClientRect().top : 0;
    state.bmore.has(m) ? state.bmore.delete(m) : state.bmore.add(m); render();
    const h2 = document.getElementById("bm-"+m); if(h2) window.scrollBy(0, h2.getBoundingClientRect().top - top); return; }
  const bj = e.target.closest("[data-bjump]"); if(bj){ document.getElementById("bm-"+bj.dataset.bjump)?.scrollIntoView({behavior:"smooth"}); return; }
  const gm = e.target.closest("[data-gomonth]"); if(gm){ state.month=gm.dataset.gomonth; go("month"); return; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="msel"){ state.month=e.target.value; render(); }
  if(["bmonth","byear","bcat"].includes(e.target.id)) state.bmore.clear();
  if(e.target.id==="bmonth"){ state.ball = e.target.value==="all"; if(!state.ball) state.month=e.target.value; render(); }
  if(e.target.id==="byear"){ // 같은 달이 그해에 있으면 그 달, 없으면 그해 마지막 달
    const y = e.target.value, same = `${y}-${state.month.slice(5)}`;
    state.month = M.includes(same) ? same : M.filter(m=>m.startsWith(y)).pop(); render(); }
  if(e.target.id==="bcat"){ state.bcat=e.target.value; render(); }
});
function go(tab){ state.tab=tab; history.replaceState(null,"","#"+tab); chrome(); render(); window.scrollTo({top:0}); }

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(html, x, y){ tip.innerHTML=html; tip.hidden=false; const w=tip.offsetWidth, h=tip.offsetHeight; let L=x+14, T=y+14; if(L+w>innerWidth-8) L=x-w-14; if(T+h>innerHeight-8) T=y-h-14; tip.style.left=Math.max(8,L)+"px"; tip.style.top=Math.max(8,T)+"px"; }
document.addEventListener("mouseover", e=>{ const el=e.target.closest("[data-tip]"); if(el) showTip(el.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("mousemove", e=>{ const el=e.target.closest("[data-tip]"); if(el) showTip(el.dataset.tip, e.clientX, e.clientY); else if(!e.target.closest(".kw svg")) tip.hidden=true; });
document.addEventListener("mouseleave", ()=>tip.hidden=true);

/* ---------- views ---------- */
function render(){
  const app = document.getElementById("app");
  const v = {summary, steady, season, month, brand, browse}[state.tab]();
  app.innerHTML = `<section class="view">${v}</section>`;
}

function seasonLeaders(){
  // 세부 종류마다: 계절 평균(대분류 TOP 30 안 개수) ÷ 1년 평균 → 계절성이 가장 뚜렷한 것
  const out = {};
  SEASONS.forEach(([name, months])=>{
    const rows = [];
    Object.entries(G().composition).forEach(([cat, comp])=>{
      Object.entries(comp.calendar).forEach(([sub, cal])=>{
        const vals = cal.filter(v=>v!=null); if(!vals.length) return;
        const year = vals.reduce((a,b)=>a+b,0)/vals.length;
        const s = months.map(m=>cal[m-1]).filter(v=>v!=null);
        const sv = s.reduce((a,b)=>a+b,0)/(s.length||1);
        if(sv>=3 && sv>=year*1.3) rows.push({sub, cat, sv, year, lift: sv/(year||0.1)});
      });
    });
    rows.sort((a,b)=>b.sv-a.sv);
    out[name]=rows.slice(0,6);
  });
  return out;
}

function summary(){
  const f = (R.findings||[]).filter(x=>!x.g || x.g===state.g || x.g==="all");
  const leaders = seasonLeaders();
  return `
  <div class="block">
    <div><div class="eyebrow">${GEN[state.g]} 기준</div><h2>핵심 발견</h2></div>
    ${f.length?`<div class="findings">${f.map(x=>`<article class="finding"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p>${(x.ids||[]).length?`<div class="thumbs">${x.ids.slice(0,6).map(id=>`<a href="${url(id)}" target="_blank" rel="noreferrer" title="${esc(P(id).b+' '+P(id).n)}">${photo(id)}</a>`).join("")}</div>`:""}</article>`).join("")}</div>`:`<p class="empty">원인 조사를 정리하는 중입니다.</p>`}
  </div>
  <div class="block">
    <div><h2>계절마다 TOP 30을 채우는 옷</h2><p class="lede">세부 종류가 대분류 TOP 30에서 평균 몇 자리를 차지했는지 계절별로 셌습니다(${M.length}개월 평균). 1년 평균보다 1.3배 이상 많고 3자리 이상인 것만 보여 줍니다.</p></div>
    <div class="seasons">${SEASONS.map(([name,ms])=>`<div class="season"><h3>${name}<small>${ms.join("·")}월</small></h3>${leaders[name].length?`<ol>${leaders[name].map(r=>`<li><span>${esc(r.sub)}<span class="c">${TOP[r.cat]}</span></span><span class="v">${r.sv.toFixed(1)}자리 · 평소 ${r.year.toFixed(1)}</span></li>`).join("")}</ol>`:`<p class="empty">뚜렷한 시즌템 없음</p>`}${R.seasons&&R.seasons[name]?`<p class="reason">${esc(R.seasons[name])}</p>`:""}</div>`).join("")}</div>
  </div>`;
}

function strip(ranks){
  return `<div class="strip-wrap"><div class="strip" style="grid-template-columns:repeat(${M.length},minmax(9px,1fr))">${ranks.map((r,i)=>`<i style="background:var(--h${rankLevel(r)})" data-tip="${esc(ymLabel(M[i]))} · ${r?r+"위":"TOP 30 밖"}"></i>`).join("")}</div>
  <div class="strip-years" style="grid-template-columns:repeat(${M.length},minmax(9px,1fr))">${M.map((ym,i)=>`<span>${ym.endsWith("-01")||i===0?"’"+ym.slice(2,4):""}</span>`).join("")}</div></div>`;
}
const rankLegend = `<div class="legend"><span><i style="background:var(--h6)"></i>1–3위</span><span><i style="background:var(--h5)"></i>4–5위</span><span><i style="background:var(--h4)"></i>6–10위</span><span><i style="background:var(--h3)"></i>11–20위</span><span><i style="background:var(--h2)"></i>21–30위</span><span><i style="background:var(--h0)"></i>TOP 30 밖</span></div>`;

function steady(){
  const list = G().persistent.filter(p=>state.cat==="all"||p.cat===state.cat).slice(0,30);
  return `
  <div class="block">
    <div><h2>꾸준템: 가장 오래 TOP 30에 머문 옷</h2><p class="lede">대분류(상의·아우터·바지·원피스/스커트) 월간 TOP 30에 든 달이 많은 순서입니다. 막대 한 칸이 한 달이고, 진할수록 순위가 높습니다.</p></div>
    <div class="chips">${[["all","전체"],...topCats()].map(([k,v])=>`<button type="button" data-cat="${k}" aria-pressed="${state.cat===k}">${v}</button>`).join("")}</div>
    ${rankLegend}
    <div class="plist">${list.map((p,i)=>{ const q=P(p.id); const why=itemReason(p.id); return `
      <div class="prow"><div class="no">${i+1}</div>${photo(p.id)}
        <div class="pbody">
          <div><div class="pbrand">${esc(q.b)} · ${esc(q.s)}${q.x?" · 판매 종료":""}</div><div class="pname"><a href="${url(p.id)}" target="_blank" rel="noreferrer">${esc(q.n)}</a></div></div>
          <div class="pmeta"><span><b>${p.months}</b>개월 진입</span><span>최장 <b>${p.streak}</b>개월 연속</span><span>최고 <b>${p.best}</b>위</span><span>평균 <b>${p.avg}</b>위</span><span>${ymShort(p.first)} ~ ${ymShort(p.last)}</span></div>
          ${strip(p.ranks)}
          ${why?`<p class="reason">${esc(why)}</p>`:""}
        </div></div>`;}).join("")}</div>
  </div>`;
}

const heatLegend = `<div class="legend">TOP 30 중 개수 <span><i style="background:var(--h0)"></i>0</span><span><i style="background:var(--h1)"></i>1–2</span><span><i style="background:var(--h2)"></i>3–4</span><span><i style="background:var(--h3)"></i>5–7</span><span><i style="background:var(--h4)"></i>8–11</span><span><i style="background:var(--h5)"></i>12–16</span><span><i style="background:var(--h6)"></i>17–30</span></div>`;


/* ---------- 계절별 추천 아이템 (디자이너 참고용) ---------- */
const TAG_NAMES = {fit:"핏", silhouette:"실루엣·기장", texture:"원단·가공", detail:"디테일", color:"컬러"};
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
function nextSeason(){ const m = new Date().getMonth()+1; const order=["봄","여름","가을","겨울"]; return order[(order.indexOf(SEASON_OF(m))+1)%4]; }
// 전체: 점수 = 가장 최근 그 계절 평균 자리 × 0.6 + 전체 기간 그 계절 평균 × 0.4
// 연도별: 그해 그 계절 달(겨울은 그해 1·2·12월)의 평균 자리, 비교는 전년 같은 계절
function seasonRecs(seasonName, year){
  const months = SEASONS.find(s=>s[0]===seasonName)[1];
  const inSeason = (ym, y) => months.includes(+ym.slice(5)) && (y==="all" || ym.slice(0,4)===String(y));
  const idx = M.map((ym,i)=>inSeason(ym, year)?i:-1).filter(i=>i>=0);
  if(!idx.length) return [];
  const recent = year==="all" ? idx.slice(-3) : idx;
  const before = year==="all" ? idx.slice(-6,-3) : M.map((ym,i)=>inSeason(ym, +year-1)?i:-1).filter(i=>i>=0);
  const fullBefore = year==="all" ? before.length===3 : before.length===idx.length;
  const cands = [];
  topCats().forEach(([cat,catName])=>{
    const comp = G().composition[cat]; if(!comp) return;
    Object.entries(comp.by_month).forEach(([sub,counts])=>{
      if(sub==="기타") return;
      const all = mean(idx.map(i=>counts[i])), rec = mean(recent.map(i=>counts[i]));
      const prev = fullBefore ? mean(before.map(i=>counts[i])) : null;
      const usual = mean(counts);
      if(all < 2) return;
      cands.push({sub, cat, catName, all, rec, prev, year: usual, score: year==="all" ? rec*0.6 + all*0.4 : all});
    });
  });
  cands.sort((a,b)=>b.score-a.score);
  // 대분류마다 1등 먼저(겨울 아우터처럼 세부 종류가 잘게 나뉜 대분류도 빠지지 않게), 남은 자리는 점수순(대분류당 최대 2개)
  const out = [], perCat = {};
  topCats().forEach(([cat])=>{ const c = cands.find(x=>x.cat===cat); if(c){ out.push(c); perCat[cat]=1; } });
  for(const c of cands){ if(out.length>=5) break; if(out.includes(c) || (perCat[c.cat]||0) >= 2) continue; perCat[c.cat]=(perCat[c.cat]||0)+1; out.push(c); }
  out.sort((a,b)=>b.score-a.score); out.length = Math.min(out.length, 5);
  // 대표 상품과 디자인 키워드: 이 계절 달들의 대분류 TOP 30에서 그 종류 상품을 순위 가중치로 모음
  out.forEach(c=>{
    const w = {};

/* ---------- 카테고리별 옷 종류 분석 (무신사 랭킹 데이터만: 대분류 TOP 30 + 세부 카테고리 TOP 30) ---------- */
const TYPE_GROUPS = ["silhouette","fit","texture","detail"];   // 옷 종류+디자인 조합에 쓰는 특징 (컬러는 보조 정보로만)
const won = v => v==null ? "-" : v.toLocaleString("ko-KR")+"원";
const manwon = v => (Math.round(v/1000)/10).toString().replace(/\.0$/,"")+"만";
function median(a){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), m=Math.floor(b.length/2); return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2); }
function quant(a,q){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y); return b[Math.min(b.length-1, Math.floor(q*(b.length-1)+0.5))]; }
function subCode(cat, sub){ const e = Object.entries(D.categories).find(([,v])=>v.parent===cat && v.name===sub); return e ? e[0] : null; }
// 계절·연도 → 달 번호들 (seasonRecs와 같은 규칙: 겨울 = 그해 1·2·12월)
function periodIdx(seasonName, year){
  const months = SEASONS.find(x=>x[0]===seasonName)[1];
  const inS = (ym, y) => months.includes(+ym.slice(5)) && (y==="all" || ym.slice(0,4)===String(y));
  const idx = M.map((ym,i)=>inS(ym, year)?i:-1).filter(i=>i>=0);
  const before = year==="all" ? idx.slice(-6,-3) : M.map((ym,i)=>inS(ym, +year-1)?i:-1).filter(i=>i>=0);
  const baseIdx = year==="all" ? idx.slice(-3) : idx;               // 비교할 때 '지금'
  const fullBefore = before.length>0 && before.length===baseIdx.length;
  return {idx, before, baseIdx, fullBefore};
}
// 순위표 가중치: 1위 30점 … 30위 1점, 달마다 더함
function listWeights(code, idxs){ const w={}; idxs.forEach(i=>(((G().top[code]||{})[M[i]])||[]).forEach((id,r)=>{ w[id]=(w[id]||0)+(30-r); })); return w; }
function tagShares(w){ // {group: {tag: 가중 비율}}
  const tot = Object.values(w).reduce((a,b)=>a+b,0) || 1, out = {};
  Object.entries(w).forEach(([id,v])=>{ const k=P(id).k||{}; Object.entries(k).forEach(([g,tags])=>tags.forEach(t=>{ (out[g]=out[g]||{})[t]=((out[g]||{})[t]||0)+v/tot; })); });
  return out;
}
function redundant(tag, sub){ return tag.replace(/ 기장/g,"").split("/").some(part=>part && sub.includes(part.trim())); }
function catTypeData(cat, seasonName, year){
  const {idx, before, baseIdx, fullBefore} = periodIdx(seasonName, year);
  const comp = (G().composition[cat]||{}).by_month || {};
  const types = [];
  Object.entries(comp).forEach(([sub, counts])=>{
    if(sub==="기타") return;
    const avg = mean(idx.map(i=>counts[i])); if(avg < 0.3) return;
    const now = mean(baseIdx.map(i=>counts[i])), was = fullBefore ? mean(before.map(i=>counts[i])) : null;
    const code = subCode(cat, sub);
    const w = code ? listWeights(code, idx) : {};
    const wPrev = code && fullBefore ? listWeights(code, before) : null;
    const shares = tagShares(w), sharesPrev = wPrev ? tagShares(wPrev) : null;
    const ids = Object.keys(w).sort((a,b)=>w[b]-w[a]);
    const prices = ids.map(id=>P(id).p).filter(Boolean);
    const brandW = {}; ids.forEach(id=>{ const b=P(id).b; brandW[b]=(brandW[b]||0)+w[id]; });
    const brands = Object.entries(brandW).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([b])=>b);
    const topTags = TYPE_GROUPS.flatMap(g=>Object.entries(shares[g]||{}).filter(([t])=>!redundant(t,sub)).map(([t,v])=>[t,v])).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t])=>t);
    const color = Object.entries(shares.color||{}).sort((a,b)=>b[1]-a[1])[0];
    types.push({sub, code, avg, now, was, w, ids, shares, sharesPrev, prices, brands, topTags, color: color ? color[0] : null});
  });
  types.sort((a,b)=>b.avg-a.avg);
  // ① 옷 종류 + 디자인 조합: 종류가 대분류 TOP 30에서 차지한 평균 자리 × 그 종류 세부 TOP 30 안에서 그 특징을 가진 비율(순위 가중)
  const combos = [];
  types.forEach(t=>{
    const cands = [];
    TYPE_GROUPS.forEach(g=>Object.entries(t.shares[g]||{}).forEach(([tag, share])=>{
      if(share < 0.2 || redundant(tag, t.sub)) return;
      const prev = t.sharesPrev ? ((t.sharesPrev[g]||{})[tag]||0) : null;
      cands.push({g, tag, share, prev, est: t.avg*share});
    }));
    cands.sort((a,b)=>b.est-a.est).slice(0,2).forEach(c=>combos.push({...c, t}));
  });

    const ids = c.t.ids.filter(id=>((P(id).k||{})[c.g]||[]).includes(c.tag));
    const other = {}; ["silhouette","fit","texture","detail","color"].filter(g=>g!==c.g).forEach(g=>{
      const cnt={}; let tot=0; ids.forEach(id=>{ ((P(id).k||{})[g]||[]).forEach(v=>{ cnt[v]=(cnt[v]||0)+c.t.w[id]; }); tot+=c.t.w[id]; });
      const top = Object.entries(cnt).filter(([v,n])=>n>=tot*0.2 && !redundant(v,c.t.sub)).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([v])=>v);
      if(top.length) other[g]=top;
    });
    return {...c, name: `${c.tag.replace(/ 기장$/,"")} ${c.t.sub}`, ids: ids.slice(0,4), prices: ids.map(id=>P(id).p).filter(Boolean), other};
  });
  // ② 개별 상품: 이 기간 대분류 TOP 30 순위 가중치 합, 판매 종료 제외, 한 종류에서 최대 2개
  const wCat = listWeights(cat, idx), perSub = {}, prodPicks = [];
  Object.keys(wCat).sort((a,b)=>wCat[b]-wCat[a]).forEach(id=>{
    const q = P(id); if(q.x || prodPicks.length>=5) return;
    if((perSub[q.s]||0) >= 2) return; perSub[q.s]=(perSub[q.s]||0)+1;
    let months = 0, best = 99; idx.forEach(i=>{ const r=(((G().top[cat]||{})[M[i]])||[]).indexOf(id); if(r>=0){ months++; best=Math.min(best,r+1); } });
    prodPicks.push({id, months, best, total: idx.length});
  });
  return {types, comboPicks, prodPicks, fullBefore, hasData: idx.length>0};
}

// 세부 종류마다: 매년 특정 달에 몰리는지(시즌템), 1년 내내 있는지
function seasonProfile(cat){
  const comp = G().composition[cat]; const seasonal = [], always = [];
  if(!comp) return {seasonal, always};
  Object.entries(comp.calendar).forEach(([sub, cal])=>{
    const vals = cal.map(v=>v??0), peak = Math.max(...vals), mean = vals.reduce((a,b)=>a+b,0)/12;
    const counts = comp.by_month[sub], present = counts.filter(n=>n>=2).length / counts.length;
    if(present >= 0.8) always.push({sub, mean});
    else if(peak >= 3 && peak >= mean*1.8){
      const months = vals.map((v,i)=>v >= Math.max(2, peak*0.5) ? i+1 : 0).filter(Boolean);
      const top = vals.indexOf(peak)+1;
      seasonal.push({sub, peak, months, top});
    }
  });
  seasonal.sort((a,b)=>((a.top+9)%12)-((b.top+9)%12));   // 3월(봄)부터
  always.sort((a,b)=>b.mean-a.mean);
  return {seasonal, always};
}
function monthSpan(ms){ // [11,12,1] → "11·12·1월" (연말→연초 순서 유지)
  const sorted = [...ms].sort((a,b)=>a-b);
  const wrap = sorted.includes(12) && sorted.includes(1) && sorted.some(m=>m<=2) && sorted.some(m=>m>=10);
  const order = wrap ? [...sorted.filter(m=>m>=6), ...sorted.filter(m=>m<6)] : sorted;
  return order.join("·")+"월";
}

    ${R.categories&&R.categories[cat]?`<div class="note">${esc(R.categories[cat])}</div>`:""}
    <div class="profile">
      <div class="pcol"><div class="eyebrow">매년 이때 돌아오는 옷</div>${seasonal.length?`<ul>${seasonal.map(x=>`<li><span class="dot dot-s"></span><b>${esc(x.sub)}</b><span class="pm">${monthSpan(x.months)} · 가장 많을 때 평균 ${x.peak.toFixed(0)}자리</span></li>`).join("")}</ul>`:`<p class="empty">뚜렷한 시즌템이 없습니다.</p>`}</div>
      <div class="pcol"><div class="eyebrow">1년 내내 있는 옷</div>${always.length?`<ul>${always.map(x=>`<li><span class="dot dot-a"></span><b>${esc(x.sub)}</b><span class="pm">평균 ${x.mean.toFixed(0)}자리</span></li>`).join("")}</ul>`:`<p class="empty">해당 없음</p>`}</div>
    </div>
  </div>
  <div class="block">
    <div class="legend"><span><i style="background:var(--accent)"></i>시즌템</span><span><i style="background:var(--muted)"></i>1년 내내 있는 옷</span><span><i style="background:var(--axis)"></i>그 밖</span></div>
    <div class="chips" aria-label="달별 목록 연도">${listYears.map(y=>`<button type="button" data-sly="${y}" aria-pressed="${ly===y}">${y}년</button>`).join("")}</div>
    <div class="slist">${rows}</div>
  </div>`;
}

function month(){
  const ym = state.month, i = M.indexOf(ym);
  const ctx = (R.months||{})[ym] || {};
  const notable = (G().notable[ym]||[]);
  const KIND = {"신규 진입":"new","재진입":"re","급상승":"up"};
  return `
  <div class="block">
    <div class="month-nav">
      <button type="button" data-mstep="-1" ${i<=0?"disabled":""} aria-label="이전 달">‹</button>
      <select id="msel" aria-label="달 선택">${M.map(m=>`<option value="${m}" ${m===ym?"selected":""}>${ymLabel(m)}</option>`).join("")}</select>
      <button type="button" data-mstep="1" ${i>=M.length-1?"disabled":""} aria-label="다음 달">›</button>
    </div>
    <div class="context">
      <div class="eyebrow">${ymLabel(ym)}의 배경</div>
      ${ctx.summary?`<p>${esc(ctx.summary)}</p>`:`<p class="empty">이 달 배경은 아직 정리 전입니다.</p>`}
      ${(ctx.points||[]).length?`<ul>${ctx.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
      ${(ctx.sources||[]).length?`<div class="sources">출처 ${ctx.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)}</a>`).join("")}</div>`:""}
    </div>
  </div>
  <div class="block">
    <div><h2>이달 새로 뜬 옷</h2><p class="lede">${GEN[state.g]} 대분류 TOP 30에 처음 들어왔거나(신규), 빠졌다 돌아왔거나(재진입), 지난달보다 10계단 넘게 오른(급상승) 상품입니다.</p></div>
    ${i===0?`<p class="empty">첫 달이라 비교할 지난달이 없습니다.</p>`:notable.length?`<div class="cards">${notable.map(c=>{const q=P(c.id); const why=itemReason(c.id, ym); return `<div class="card">${photo(c.id)}<div class="pbody"><div><span class="badge ${KIND[c.kind]}">${c.kind}</span><span class="pmeta"><b>${c.rank}</b>위${c.prev?` (지난달 ${c.prev}위)`:""} · ${TOP[q.c]||""}</span></div><div class="pbrand">${esc(q.b)} · ${esc(q.s)}</div><div class="pname"><a href="${url(c.id)}" target="_blank" rel="noreferrer">${esc(q.n)}</a></div>${why?`<p class="reason">${esc(why)}</p>`:""}</div></div>`;}).join("")}</div>`:`<p class="empty">큰 변화 없이 지난달 상품이 그대로 유지된 달입니다.</p>`}
  </div>
  <div class="block">
    <h2>${ymLabel(ym)} 대분류 TOP 5</h2>
    <div class="tops">${topCats().map(([cat,name])=>{ const ids=(G().top[cat]||{})[ym]||[]; return `<div class="topcol"><h3>${name}<button type="button" data-browse="${cat}">30위까지 ›</button></h3>${ids.slice(0,5).map((id,k)=>{const q=P(id); return `<a class="mini" href="${url(id)}" target="_blank" rel="noreferrer" style="text-decoration:none"><span class="r">${k+1}</span>${photo(id)}<span class="mt"><span class="mb">${esc(q.b)}</span><span class="nm">${esc(q.n)}</span></span></a>`;}).join("")||'<p class="empty">자료 없음</p>'}</div>`;}).join("")}</div>
  </div>`;
}

// 막대 한 줄: 이름 | 막대(+ 비교 세로선) | 값 | 변화
function barRow(name, val, max, unit, cmp, tip){
  const w = max>0 ? Math.max(1.5, val/max*100) : 0, cw = cmp==null||max<=0 ? null : Math.min(100, cmp/max*100);
  const d = cmp==null ? null : val-cmp;
  const dTxt = d==null ? "<span></span>" : Math.abs(d) < 0.5 ? `<span class="dl">–</span>` : `<span class="dl ${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d).toFixed(0)}${unit==="%"?"%p":""}</span>`;
  return `<div class="barrow" data-tip="${esc(tip)}"><span class="bn">${esc(name)}</span><span class="bt"><i style="width:${w.toFixed(1)}%"></i>${cw!=null?`<b style="left:${cw.toFixed(1)}%" aria-hidden="true"></b>`:""}</span><span class="bv">${unit==="%"?val.toFixed(0)+"%":val}</span>${dTxt}</div>`;
}
function brand(){
  const B = G().brands, n = M.length;
  const sum = (a, ids) => ids.reduce((x,i)=>x+(a[i]||0),0);
  const r6 = [0,1,2,3,4,5].map(k=>n-6+k).filter(i=>i>=0), p6 = [0,1,2,3,4,5].map(k=>n-12+k).filter(i=>i>=0);
  const totals = [...B].sort((a,b)=>b.total-a.total).slice(0,15);
  const maxT = Math.max(1, ...totals.map(b=>b.total));
  const rising = n>=12 ? B.map(b=>({b, now: sum(b.counts, r6), was: sum(b.counts, p6)})).filter(x=>x.now>=4 && x.now > x.was).sort((a,b)=>(b.now-b.was)-(a.now-a.was)).slice(0,10) : [];
  const maxR = Math.max(1, ...rising.map(x=>Math.max(x.now,x.was)));
  return `
  <div class="block">
    <div><h2>브랜드 랭킹</h2><p class="lede">대분류 TOP 30에 상품을 몇 자리 올렸는지 셌습니다(한 상품이 여러 달 들면 달마다 셈).</p>${R.brands_note?`<div class="note">${esc(R.brands_note)}</div>`:""}</div>
    <div class="bgrid two">
      <div class="bgroup"><h3>${n}개월 누적 TOP 15</h3>${totals.map(b=>barRow(b.brand, b.total, maxT, "", null, `${b.brand}: ${n}개월 합계 ${b.total}자리`)).join("")}</div>
      <div class="bgroup"><h3>최근 6개월 뜨는 브랜드</h3>${rising.length?rising.map(x=>barRow(x.b.brand, x.now, maxR, "", x.was, `${x.b.brand}: 최근 6개월 ${x.now}자리 · 그 전 6개월 ${x.was}자리`)).join(""):`<p class="empty">비교할 기간이 부족합니다.</p>`}<p class="bfoot">막대 = 최근 6개월(${ymShort(M[r6[0]])}~${ymShort(M[n-1])}), 세로 선 = 그 전 6개월</p></div>
    </div>
  </div>`;
}

// 한 달치 순위표 (등락은 바로 전달과 비교). limit이 있으면 그 줄까지만 + '30위까지 보기' 버튼
function rankTable(ym, limit){
  const i = M.indexOf(ym), prev = i>0?M[i-1]:null, byMonth = G().top[state.bcat]||{};
  const all = byMonth[ym]||[];
  const ids = limit ? all.slice(0, limit) : all;
  const toggle = state.ball && all.length > 10
    ? `<button type="button" class="bmore-btn" data-bmore="${ym}">${limit ? `${all.length}위까지 보기 ›` : "10위까지 접기 ‹"}</button>` : "";
  const prevIds = prev?(byMonth[prev]||[]):null;
  const seenBefore = id => M.slice(0,i).some(m=>(byMonth[m]||[]).includes(id));
  return ids.length?`<div class="rank-table">${ids.map((id,k)=>{const q=P(id); let st="", cls=""; if(prevIds){ const pi=prevIds.indexOf(id); if(pi<0){ if(seenBefore(id)){st="재진입";cls="re";} else {st="신규";cls="new";} } else { const d=pi-k; st=d>0?`▲${d}`:d<0?`▼${-d}`:"–"; cls=d>=10?"up":""; } } return `<div class="rrow"><span class="r">${k+1}</span>${photo(id)}<span><a href="${url(id)}" target="_blank" rel="noreferrer" style="text-decoration:none">${esc(q.n)}</a><br><span class="pbrand">${esc(q.b)}${q.x?" · 판매 종료":""}</span>${q.p?`<span class="rprice">정가 ${q.p.toLocaleString("ko-KR")}원</span>`:""}</span><span class="st ${cls}">${st}</span></div>`;}).join("")}</div>${toggle}`:`<p class="empty">이 달·카테고리는 무신사 아카이브에 순위가 없습니다.</p>`;
}

function browse(){
  const ym = state.month, yr = ym.slice(0,4), yearMonths = M.filter(m=>m.startsWith(yr));
  const cats = D.categories;
  const opts = topCats().map(([code,name])=>`<optgroup label="${name}"><option value="${code}" ${state.bcat===code?"selected":""}>${name} 전체</option>${Object.entries(cats).filter(([,c])=>c.parent===code).map(([sc,c])=>`<option value="${sc}" ${state.bcat===sc?"selected":""}>${esc(c.name)}</option>`).join("")}</optgroup>`).join("");
  return `
  <div class="block">
    <div><h2>순위 찾아보기</h2><p class="lede">달·카테고리를 골라 무신사 월간 TOP 30 전체를 봅니다. 세부 카테고리(니트, 패딩, 데님 팬츠 등)도 고를 수 있고, 달에서 '전체'를 고르면 그해 1~12월의 달마다 TOP 10을 이어서 보여 주고, '30위까지 보기'로 펼칩니다.</p>${(D.price_dates||[]).length?`<p class="bfoot">정가: ${D.price_dates[1].slice(0,4)}년 ${+D.price_dates[1].slice(5,7)}월 무신사 상품 페이지 조회 기준(그 달 당시 가격이 아님). 아직 받지 못한 상품은 비어 있습니다.</p>`:""}</div>
    <div class="filters">
      <select id="byear" aria-label="연도">${[...new Set(M.map(m=>m.slice(0,4)))].map(y=>`<option value="${y}" ${ym.startsWith(y)?"selected":""}>${y}년</option>`).join("")}</select>
      <select id="bmonth" aria-label="달"><option value="all" ${state.ball?"selected":""}>전체</option>${yearMonths.map(m=>`<option value="${m}" ${!state.ball&&m===ym?"selected":""}>${+m.slice(5)}월</option>`).join("")}</select>
      <select id="bcat" aria-label="카테고리">${opts}</select>
      ${state.ball?"":`<button type="button" data-gomonth="${ym}" style="font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer">이 달 배경 보기 ›</button>`}
    </div>
    ${state.ball?`
    <div class="chips" aria-label="달로 이동">${yearMonths.map(m=>`<button type="button" data-bjump="${m}">${+m.slice(5)}월</button>`).join("")}</div>
    ${yearMonths.length<12?`<p class="bfoot">${yr}년은 ${yearMonths.map(m=>+m.slice(5)+"월").join("·")} 자료만 있습니다.</p>`:""}
    <div>${yearMonths.map(m=>`<div class="mhead" id="bm-${m}"><h3>${ymLabel(m)}</h3><button type="button" data-gomonth="${m}">이 달 배경 보기 ›</button></div>${rankTable(m, state.bmore.has(m) ? null : 10)}`).join("")}</div>`
    : rankTable(ym)}
  </div>`;
}

chrome(); render();
</script>
