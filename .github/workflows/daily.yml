# 매일 한국시간 오전 10시: 무신사 의류 랭킹(최근 1일) 수집 → 상세정보 → 분석 → 고정 주소 리포트에 날짜 추가
name: musinsa-daily-report

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = KST 10:00 (GitHub 사정으로 10~20분 늦을 수 있음)
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 새 상품이 많은 날 상세정보 수집이 길어질 수 있음
    # 실패 알림: 이 작업이 실패하면 GitHub이 저장소 주인 계정 이메일로 자동 알림을 보냄 (별도 메일 설정 없음)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 · 분석 · 리포트 생성
        run: python tools/run_daily.py

      - name: 기록과 리포트 저장(push)
        if: always()   # 도중에 멈춰도 받은 상세정보는 저장
        run: |
          git config user.name "musinsa-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "daily report $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push
