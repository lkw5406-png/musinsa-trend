# ※ 원본은 비공개 저장소 musinsa-trend-code의 site/.github/workflows/daily.yml — 공개 저장소(musinsa-trend)에서 고치지 말 것. 원본을 고치면 publish.yml이 복사해 옴
# 매일 한국시간 오전 6시: 무신사 의류 랭킹(일간·주간·월간) 수집 → 상세정보 → 후기 요약 → 분석 → 리포트
# 무신사 랭킹은 매일 새벽 4시 45분쯤 갱신되고, 지난 랭킹은 다시 받을 수 없음 → 낮 12시·밤 8시에 빠진 것만 다시 받음
# 코드는 비공개 저장소에 있음(2026-09-29 사장님 결정). 실행은 공개 저장소에서(실행 시간 무료·무제한) → 코드를 받아 돌리고 결과(data·docs)는 비공개 저장소에 저장.
# 보고서 페이지 공개와 Claude 루틴 시작은 비공개 저장소의 publish.yml이 이어서 함.
name: musinsa-daily-report

on:
  schedule:
    - cron: "0 21 * * *"  # UTC 21:00 = KST 다음 날 06:00 — 본 실행 (GitHub 사정으로 10~20분 늦을 수 있음)
    - cron: "0 3 * * *"   # UTC 03:00 = KST 12:00 — 재확인 (오늘 수집이 빠진 기간만)
    - cron: "0 11 * * *"  # UTC 11:00 = KST 20:00 — 재확인
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼 (빠진 것만 받음)

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 월요일·1일(주간·월간 리포트가 겹치는 날)과 새 상품이 많은 날 대비
    # 실패 알림: 이 작업이 실패하면 GitHub이 저장소 주인 계정 이메일로 자동 알림을 보냄 (별도 메일 설정 없음)
    steps:
      - name: 코드 받기 (비공개 저장소)
        uses: actions/checkout@v4
        with:
          repository: lkw5406-png/musinsa-trend-code
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 · 분석 · 리포트 생성
        run: |
          if [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
            python tools/run_daily.py
          else
            python tools/run_daily.py --only-missing
          fi

      - name: 기록과 리포트 저장(push → 비공개 저장소)
        if: always()   # 도중에 멈춰도 받은 상세정보는 저장
        run: |
          git config user.name "musinsa-report-bot"
          git config user.email "actions@users.noreply.github.com"
          D=$(TZ=Asia/Seoul date +%F)
          git add data docs
          git commit -m "daily report $D" || { echo "변경 없음"; exit 0; }
          git pull --rebase   # 실행 중에 루틴·PC에서 올린 것이 있으면 합침
          git push
